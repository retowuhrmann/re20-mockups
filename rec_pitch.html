// ── Render: process node ─────────────────────────────────────────
function renderNode(nd) {
  if (shownNodes.has(nd.id)) return;
  shownNodes.add(nd.id);

  const gid = `g${nd.id}`;
  const rg = defs.append('radialGradient').attr('id',gid).attr('cx','35%').attr('cy','35%');

  rg.append('stop').attr('offset','100%').attr('stop-color', nd.color);

  const g = gN.append('g')
    .attr('class',`pnode pnode-${nd.id}`)
    .attr('transform',`translate(${nd.x},${nd.y}) scale(0)`)
    .style('opacity',0);

  g.append('circle').attr('r',nd.r+14).attr('fill','none')
    .attr('stroke',nd.color).attr('stroke-width',0.6).attr('opacity',0.2);

  const pulse = g.append('circle').attr('r',nd.r+8)
    .attr('fill','none').attr('stroke',nd.color).attr('stroke-width',1.2).attr('opacity',0);
  (function doPulse(){
    pulse.attr('r',nd.r+6).attr('opacity',0.8)
      .transition().duration(1500).ease(d3.easeCubicOut)
      .attr('r',nd.r+32).attr('opacity',0).on('end',doPulse);
  })();

  g.append('circle').attr('r',nd.r).attr('fill',`url(#${gid})`).attr('filter','url(#glow-m)');
  g.append('circle').attr('r',nd.r-3).attr('fill','none').attr('stroke','rgba(255,255,255,0.15)').attr('stroke-width',1);

  g.append('text').attr('text-anchor','middle').attr('dy',-7)
    .attr('font-size',8).attr('fill','rgba(255,255,255,0.5)').attr('letter-spacing',1.2)
    .text(nd.module.toUpperCase());
  g.append('text').attr('text-anchor','middle').attr('dy',9)
    .attr('font-size',11).attr('fill','#fff').attr('font-weight',600).text(nd.label);
  g.append('text').attr('text-anchor','middle').attr('dy',nd.r+17)
    .attr('font-size',8.5).attr('fill',nd.color).attr('opacity',0.7).text(nd.sub);

  g.transition().duration(620).ease(d3.easeBackOut.overshoot(1.15))
    .attr('transform',`translate(${nd.x},${nd.y}) scale(1)`).style('opacity',1);
}

// ── Render: link ─────────────────────────────────────────────────
function renderLink(sid,tid) {
  const key=`${sid}|${tid}`;
  if (shownLinks.has(key)) return;
  shownLinks.add(key);
  const s=NODES[sid], t=NODES[tid];
  if (!s||!t) return;
  const dx=t.x-s.x, dy=t.y-s.y, dist=Math.hypot(dx,dy);
  const ux=dx/dist, uy=dy/dist;
  const x1=s.x+ux*(s.r+2), y1=s.y+uy*(s.r+2);
  const x2=t.x-ux*(t.r+2), y2=t.y-uy*(t.r+2);
  const mid=d3.interpolateRgb(s.color,t.color)(0.5);
  const len=Math.hypot(x2-x1,y2-y1);
  gL.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',mid).attr('stroke-width',5).attr('opacity',0.1)
    .attr('stroke-dasharray',len).attr('stroke-dashoffset',len)
    .transition().duration(500).ease(d3.easeLinear).attr('stroke-dashoffset',0);
  gL.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke',mid).attr('stroke-width',1.4).attr('opacity',0.52)
    .attr('stroke-dasharray',len).attr('stroke-dashoffset',len)
    .transition().duration(500).ease(d3.easeLinear).attr('stroke-dashoffset',0);
}

// ── Info cards ───────────────────────────────────────────────────
function showCard(nodeId) {
  Object.entries(domCards).forEach(([,el])=>{
    el.classList.remove('on'); const e=el; setTimeout(()=>e.remove(),360);
  });
  Object.keys(domCards).forEach(k=>delete domCards[k]);
  if (!nodeId) return;
  const nd=NODES[nodeId]; if(!nd) return;
  const el=document.createElement('div');
  el.className='icard';
  el.innerHTML=`<h4 style="color:${nd.color}">${nd.module}: ${nd.label}</h4>`+
    nd.data.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const cw=210, ch=nd.data.length*22+52;
  let cx=nd.x+nd.r+18, cy=nd.y-ch/2;
  if (cx+cw>W-20) cx=nd.x-cw-nd.r-18;
  cy=Math.max(90,Math.min(cy,H-ch-20));
  el.style.left=`${cx}px`; el.style.top=`${cy}px`;
  document.body.appendChild(el);
  domCards[nodeId]=el;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
}

// ── Statement ────────────────────────────────────────────────────
function setStatement(data) {
  const el=document.getElementById('statement');
  if (!data) { el.classList.remove('on'); el.innerHTML=''; return; }
  el.style.top=`${H*0.38}px`;
  el.innerHTML=`<div class="stmt-big">${data.big}</div><div class="stmt-small">${data.small}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
}

// ── Zoom: CSS transition on #world — bypasses D3 SVG attr interpolation issues ──
function zoomWorld(scale, ms) {
  const tx = CX*(1-scale), ty = CY*(1-scale);
  const el = document.getElementById('world');
  el.style.transition = `transform ${ms}ms cubic-bezier(0.37,0,0.63,1)`;
  el.getBoundingClientRect(); // force reflow so transition is registered before value change
  el.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

    el.classList.remove('on'); const e=el; setTimeout(()=>e.remove(),360);
  });
  Object.keys(domCards).forEach(k=>delete domCards[k]);

  // ① Zoom to 50% — all 3 tiers fit on screen
  zoomWorld(0.50, 1400);

  // ② Dim process web
  gN.selectAll('.pnode').transition().delay(1100).duration(800).style('opacity',0.2);
  gL.selectAll('*').transition().delay(1100).duration(800).style('opacity',0.08);

  const WEB = 550; // web threads begin drawing mid-zoom

  // ③ Radial spoke threads: center → each module (the "frame" of the web)
  ALL_MODULES.forEach((m, i) => {
    const { x, y } = modPos[m.id];
    const len = Math.hypot(x - CX, y - CY);
    gL.append('line')
      .attr('x1', CX).attr('y1', CY).attr('x2', x).attr('y2', y)
      .attr('stroke', m.color).attr('stroke-width', 0.4).attr('opacity', 0)
      .attr('stroke-dasharray', len).attr('stroke-dashoffset', len)
      .transition().delay(WEB + i * 52).duration(500).ease(d3.easeLinear)
      .attr('stroke-dashoffset', 0).attr('opacity', 0.28);
  });

  // ④ Circular ring threads: connect adjacent modules within each tier (concentric web rings)
  MOD_TIERS.forEach(({ ids }, ti) => {
    ids.forEach((id, i) => {
      const next = ids[(i + 1) % ids.length];
      const pa = modPos[id], pb = modPos[next];
      const len = Math.hypot(pb.x - pa.x, pb.y - pa.y);
      gL.append('line')
        .attr('x1', pa.x).attr('y1', pa.y).attr('x2', pb.x).attr('y2', pb.y)
        .attr('stroke', `rgba(255,255,255,${0.16 - ti * 0.04})`).attr('stroke-width', 0.7)
        .style('opacity', 0)
        .attr('stroke-dasharray', len).attr('stroke-dashoffset', len)
        .transition().delay(WEB + 280 + ti * 130 + i * 48).duration(480).ease(d3.easeLinear)
        .attr('stroke-dashoffset', 0).style('opacity', 1);
    });
  });

  // ⑤ MODULE_LINKS as diagonal cross-threads
  MODULE_LINKS.forEach(([a, b], i) => {
    const pa = modPos[a], pb = modPos[b]; if (!pa || !pb) return;
    const len = Math.hypot(pb.x - pa.x, pb.y - pa.y);
    gL.append('line')
      .attr('x1', pa.x).attr('y1', pa.y).attr('x2', pb.x).attr('y2', pb.y)
      .attr('stroke', 'rgba(255,255,255,0.055)').attr('stroke-width', 0.85).style('opacity', 0)
      .attr('stroke-dasharray', len).attr('stroke-dashoffset', len)
      .transition().delay(WEB + 520 + i * 26).duration(340)
      .attr('stroke-dashoffset', 0).style('opacity', 1);
  });

  // ⑥ Module nodes pop in along the spokes
  ALL_MODULES.forEach((m, i) => {
    const { x, y } = modPos[m.id];
    const mr = 30 + Math.sqrt(m.records) * 2.2;
    const g = gN.append('g').attr('class', 'mnode')
      .attr('transform', `translate(${x},${y}) scale(0)`).style('opacity', 0);
    if (m.core) g.append('circle').attr('r', mr + 12).attr('fill', m.color).attr('opacity', 0.07).attr('filter', 'url(#glow-s)');
    g.append('circle').attr('r', mr)
      .attr('fill', `${m.color}22`).attr('stroke', m.color)
      .attr('stroke-width', m.core ? 2.5 : 1.2).attr('filter', m.core ? 'url(#glow-m)' : null);
    if (m.ch) g.append('text').attr('text-anchor', 'middle').attr('dy', -mr - 7)
      .attr('font-size', 11).attr('fill', m.color).attr('opacity', 0.6).text('CH');
    const lines = m.label.split('\n');
    if (lines.length === 1) {
      g.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
        .attr('font-size', Math.min(15, mr * 0.42)).attr('fill', '#fff').attr('font-weight', m.core ? 700 : 400)
        .text(m.label);
    } else {
      lines.forEach((ln, li) => g.append('text').attr('text-anchor', 'middle').attr('dy', -5 + li * 13)
        .attr('font-size', 12).attr('fill', '#fff').attr('font-weight', m.core ? 700 : 400).text(ln));
    }
    if (m.records > 0) g.append('text').attr('text-anchor', 'middle').attr('dy', mr + 16)
      .attr('font-size', 11).attr('fill', m.color).attr('opacity', 0.45).text(`${m.records} records`);
    g.transition().delay(1450 + i * 62).duration(540).ease(d3.easeBackOut.overshoot(1.1))
      .attr('transform', `translate(${x},${y}) scale(1)`).style('opacity', 1);
  });
}

// ── Finale phase 2: galaxy — erschlagend unglaublich gross ───────
function showFinalePhase2() {
  // ① Zoom WAY out — the web becomes a tiny galaxy in a vast universe
  zoomWorld(0.19, 1600);

  // ② Process nodes vanish almost completely
  gN.selectAll('.pnode').transition().duration(700).style('opacity', 0.03);

  const ERUPT = 450;

  // ③ Each module erupts into its attribute fields — one dot per record/attribute
  ALL_MODULES.forEach((m, mi) => {
    const { x, y } = modPos[m.id];
    const mr = 30 + Math.sqrt(m.records) * 2.2;
    const count = Math.max(m.records, 6);
    for (let j = 0; j < count; j++) {
      const a = (j / count) * 2 * Math.PI + mi * 0.41;
      const ring = Math.floor(j / 12);
      const orbitR = mr + 52 + ring * 44;
      const jitter = (Math.sin(j * 1.7 + mi) * 0.5 + 0.5) * 18 - 9;
      const finalOrbit = orbitR + jitter;
      gN.append('circle')
        .attr('cx', x + Math.cos(a) * finalOrbit * 0.25)
        .attr('cy', y + Math.sin(a) * finalOrbit * 0.25)
        .attr('r', ring === 0 ? 3.4 : ring === 1 ? 2.5 : 1.8)
        .attr('fill', m.color).attr('opacity', 0)
        .transition().delay(ERUPT + mi * 16 + j * 10).duration(520).ease(d3.easeBackOut.overshoot(0.8))
        .attr('cx', x + Math.cos(a) * finalOrbit)
        .attr('cy', y + Math.sin(a) * finalOrbit)
        .attr('opacity', ring === 0 ? 0.78 : ring === 1 ? 0.5 : 0.28);
    }
  });

  // ④ Outer "data universe" rings — showing the overwhelming volume of real data
  const UNIVERSE = [
    { r: 1080, count: 80,  color: '#6366f1', delay: 1300 },
    { r: 1320, count: 110, color: '#10b981', delay: 1650 },
    { r: 1560, count: 145, color: '#F59E0B', delay: 2000 },
    { r: 1820, count: 185, color: '#a855f7', delay: 2350 },
  ];
  UNIVERSE.forEach(({ r, count, color, delay }) => {
    for (let j = 0; j < count; j++) {
      const a = (j / count) * 2 * Math.PI;
      const jitter = (Math.sin(j * 2.3) * 0.5 + 0.5) * 90 - 45;
      const rr = r + jitter;
      gN.append('circle')
        .attr('cx', CX + Math.cos(a) * rr * 0.35)
        .attr('cy', CY + Math.sin(a) * rr * 0.35)
        .attr('r', 1.4 + Math.abs(Math.sin(j * 1.9)) * 2.2)
        .attr('fill', color).attr('opacity', 0)
        .transition().delay(delay + j * 6).duration(380)
        .attr('cx', CX + Math.cos(a) * rr)
        .attr('cy', CY + Math.sin(a) * rr)
        .attr('opacity', 0.12 + Math.abs(Math.sin(j * 0.7)) * 0.22);
    }
  });

  // ⑤ Outer universe glow halo
  gN.append('circle').attr('cx', CX).attr('cy', CY).attr('r', 1950)
    .attr('fill', 'none').attr('stroke', 'rgba(74,143,255,0.05)').attr('stroke-width', 80)
    .attr('filter', 'url(#glow-lg)').style('opacity', 0)
    .transition().delay(3000).duration(1800).style('opacity', 1);

  // ⑥ Center label — appearing as everything explodes outward
  const cg = gN.append('g').attr('transform', `translate(${CX},${CY})`).style('opacity', 0);
  cg.append('circle').attr('r', 135).attr('fill', 'rgba(4,8,22,0.96)')
    .attr('stroke', 'rgba(74,143,255,0.12)').attr('stroke-width', 1.5);
  cg.append('text').attr('text-anchor', 'middle').attr('dy', -48)
    .attr('font-size', 56).attr('font-weight', 700).attr('fill', '#fff').attr('letter-spacing', -2).text('REC');
  cg.append('text').attr('text-anchor', 'middle').attr('dy', 8)
    .attr('font-size', 22).attr('fill', 'rgba(255,255,255,0.5)').attr('letter-spacing', 2).text('Space Model');
  cg.append('text').attr('text-anchor', 'middle').attr('dy', 36)
    .attr('font-size', 14).attr('fill', 'rgba(255,255,255,0.25)').attr('letter-spacing', 0.5).text('20 Module · 315 Attribute');
  const chN = ALL_MODULES.filter(m => m.ch).length, stdN = ALL_MODULES.filter(m => !m.ch).length;
  cg.append('text').attr('text-anchor', 'middle').attr('dy', 58)
    .attr('font-size', 12).attr('fill', '#fbbf24').attr('opacity', 0.55)
    .text(`${chN}× CH-Erweiterung  ·  ${stdN}× REC-Standard`);
  cg.transition().delay(600).duration(1100).style('opacity', 1);

  // ⑦ Universe labels (fixed screen-space, appear late)
  const labels = [
    { text: 'Gebäude & Objekte', color: '#6366f1', top: '18%', left: '72%' },
    { text: 'Mietverhältnisse',  color: '#10b981', top: '72%', left: '68%' },
    { text: 'Assets & Sensoren', color: '#F59E0B', top: '78%', left: '22%' },
    { text: 'Mieter & Agenten',  color: '#a855f7', top: '14%', left: '18%' },
  ];
  labels.forEach(({ text, color, top, left }, i) => {
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;top:${top};left:${left};font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:${color};opacity:0;transition:opacity 0.8s ease;pointer-events:none;`;
    d.textContent = text;
    document.body.appendChild(d);
    setTimeout(() => d.style.opacity = '0.55', 2400 + i * 280);
  });

  // ⑧ Legend
  const leg = document.createElement('div');
  leg.style.cssText = 'position:absolute;bottom:48px;left:38px;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;line-height:19px;pointer-events:none;opacity:0;transition:opacity 1s ease;';
  leg.innerHTML = `
    <div style="margin-bottom:5px;color:rgba(255,255,255,0.5);font-weight:600;letter-spacing:1.5px;font-size:9px">LEGENDE</div>
    <div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;border:2px solid #4a8fff;margin-right:7px"></span>REC 3.3 Standard</div>
    <div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;border:2px solid #fbbf24;margin-right:7px"></span>CH-Erweiterung *</div>
    <div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.35);margin-right:7px"></span>Attribute & Datenpunkte</div>`;
  document.body.appendChild(leg);
  setTimeout(() => leg.style.opacity = '1', 1800);
}

// ── Step engine ──────────────────────────────────────────────────
function goToStep(n) {
  if (n<0||n>=STEPS.length) return;
  currentStep=n;
  const s=STEPS[n];
  document.getElementById('step-title').textContent=s.title;
  document.getElementById('step-sub').textContent=s.sub;
  document.getElementById('counter').textContent=`${n+1} / ${STEPS.length}`;
  document.getElementById('progress').style.width=`${((n+1)/STEPS.length)*100}%`;
  setStatement(s.stmt||null);
  if (!s.stmt) {
    (s.nodes||[]).forEach(id=>renderNode(NODES[id]));
    (s.links||[]).forEach(({s:sid,t:tid})=>renderLink(sid,tid));
  }
  showCard(s.card||null);
  if (s.finale==='phase1'&&finalePhase<1) { finalePhase=1; showFinalePhase1(); }
  if (s.finale==='phase2'&&finalePhase<2) { finalePhase=2; showFinalePhase2(); }
}

function advance() { goToStep(currentStep+1); }
function retreat() { if(currentStep>0) location.reload(); }

document.addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if([' ','ArrowRight','Enter'].includes(e.key)){e.preventDefault();advance();}
  if(e.key==='ArrowLeft'){e.preventDefault();retreat();}
});

goToStep(0);
</script>
