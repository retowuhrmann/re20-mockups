<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozesslandkarte · REC Space Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --bg-base:          #060b1a;
  --bg-radial-center: #0a1128;
  --bg-radial-edge:   #03060f;
  --color-vision:     #08ccab;
  --color-gold:       #f59e0b;
  --color-cyan:       #0ea5e9;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;background:var(--bg-base);background-image:radial-gradient(circle at 50% 30%,var(--bg-radial-center) 0%,var(--bg-radial-edge) 100%);min-height:100vh}
h1,h2,h3,h4{color:#f8fafc;font-weight:700}
.text-gradient{background:linear-gradient(130deg,#4a8fff 20%,#a855f7 55%,#f59e0b 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.glow-text{text-shadow:0 0 30px rgba(255,255,255,0.3)}
.code-badge{background:rgba(99,156,255,.10);border:1px solid rgba(99,156,255,.20);color:#93c5fd;padding:.2rem .7rem;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:.8rem;display:inline-block}

/* HEADER */
#hd{padding:36px 64px 28px;border-bottom:1px solid rgba(8,204,171,.12);position:relative;overflow:hidden}
#hd::before{content:'';position:absolute;top:-80px;left:30%;width:400px;height:200px;background:radial-gradient(ellipse,rgba(8,204,171,.08) 0%,transparent 70%);pointer-events:none}
.hd-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--color-vision);background:rgba(8,204,171,.10);padding:4px 12px;border-radius:9999px;border:1px solid rgba(8,204,171,.22);font-family:'JetBrains Mono',monospace}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--color-vision);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* STATS */
#stats{display:flex;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.7)}
.stat{flex:1;padding:18px 24px;text-align:center;border-right:1px solid rgba(255,255,255,.06)}
.stat:last-child{border-right:none}
.stat-n{font-size:28px;font-weight:800;line-height:1;font-family:'JetBrains Mono',monospace}
.stat-l{font-size:10px;color:#64748b;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-top:5px}

/* FILTER */
#filter{padding:14px 64px;display:flex;gap:8px;align-items:center;background:rgba(6,11,26,.5);border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.flabel{font-size:10px;color:#475569;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-right:4px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.fb{padding:5px 13px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.10);cursor:pointer;transition:all .15s;background:rgba(255,255,255,.04);color:#94a3b8;display:flex;align-items:center;gap:5px;user-select:none}
.fb:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);color:#e2e8f0}
.fb.active{color:#fff;border-color:transparent}
.fd{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* CONTENT */
#content{padding:40px 64px 80px;max-width:1500px;margin:0 auto}

/* CATEGORY */
.cat-section{margin-bottom:52px}
.cat-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06)}
.cat-count{font-size:10px;padding:2px 9px;border-radius:9999px;background:rgba(255,255,255,.07);color:#64748b;font-weight:700;font-family:'JetBrains Mono',monospace}
.cat-auto{margin-left:auto;font-size:11px;color:#475569;font-weight:500;font-family:'JetBrains Mono',monospace}

/* GRID */
.pGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}

/* CARD */
.pCard{background:rgba(10,15,30,.65);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:22px;transition:border-color .2s,box-shadow .2s,transform .15s;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.pCard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);border-radius:2px 2px 0 0;opacity:.9}
.pCard.clickable{cursor:pointer}
.pCard.clickable:hover{box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12);transform:translateY(-2px);border-color:rgba(255,255,255,.18)}
.pCard.doc-card{border-color:rgba(8,204,171,.25);box-shadow:0 0 24px rgba(8,204,171,.08),inset 0 0 20px rgba(8,204,171,.03)}
.pCard.doc-card:hover{border-color:rgba(8,204,171,.5);box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 32px rgba(8,204,171,.15)}
.pCard.fhide{display:none}

.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ci{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.sb{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 9px;border-radius:9999px;flex-shrink:0;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.sb-doc{background:rgba(8,204,171,.15);color:#08ccab;border:1px solid rgba(8,204,171,.3)}
.sb-dev{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.sb-plan{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.08)}
.sb-mvp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.35)}
.sb-sub{background:rgba(14,165,233,.12);color:#0ea5e9;border:1px solid rgba(14,165,233,.3)}

.cn{font-size:14px;font-weight:700;color:#f1f5f9;line-height:1.35}
.cd{font-size:12px;color:#64748b;line-height:1.6;flex:1}

.abar{display:flex;align-items:center;gap:8px}
.abar-track{height:2px;border-radius:2px;background:rgba(255,255,255,.08);flex:1;overflow:hidden}
.abar-fill{height:100%;border-radius:2px;background:var(--ac)}
.abar-pct{font-size:10px;color:#475569;font-weight:700;width:30px;text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace}

.cf{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.ab{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 10px;border-radius:9999px;background:rgba(var(--ac-rgb),.12);color:var(--ac);border:1px solid rgba(var(--ac-rgb),.2)}
.vl{font-size:11px;font-weight:700;color:var(--ac);text-decoration:none;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
.pCard:hover .vl{opacity:1}
.cat-section.fhide{display:none}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
</style>
</head>
<body>

<header id="hd">
  <div class="flex justify-between items-start">
    <div>
      <div class="hd-tag"><span class="hd-dot"></span>REC Space Model · BOS</div>
      <h1 class="text-4xl font-bold mt-1 mb-2 text-gradient glow-text">Prozesslandkarte</h1>
      <p class="text-sm" style="color:#64748b">Business Operating System · KI-gestützte Prozessautomatisierung · Immobilienwirtschaft CH</p>
    </div>
    <div class="text-right">
      <div class="code-badge">v1.0 · 2026</div>
      <p class="text-xs mt-2" id="hd-meta" style="color:#334155"></p>
    </div>
  </div>
</header>

<div id="stats">
  <div class="stat"><div class="stat-n" id="s-total" style="color:#f8fafc"></div><div class="stat-l">Prozesse gesamt</div></div>
  <div class="stat"><div class="stat-n" id="s-doc"   style="color:var(--color-vision)"></div><div class="stat-l">Dokumentiert</div></div>
  <div class="stat"><div class="stat-n" id="s-dev"   style="color:var(--color-gold)"></div><div class="stat-l">In Entwicklung</div></div>
  <div class="stat"><div class="stat-n" id="s-plan"  style="color:#334155"></div><div class="stat-l">Geplant</div></div>
  <div class="stat"><div class="stat-n" id="s-mvp"   style="color:#f59e0b"></div><div class="stat-l">MVP</div></div>
  <div class="stat"><div class="stat-n" id="s-auto"  style="color:var(--color-cyan)"></div><div class="stat-l">Ø Automation</div></div>
</div>

<div id="filter">
  <span class="flabel">filter</span>
  <button class="fb active" data-f="all" onclick="setFilter('all',this)">Alle</button>
  <button class="fb" data-f="mvp" onclick="setFilter('mvp',this)"><span class="fd" style="background:#f59e0b"></span>MVP</button>
</div>

<div id="content"></div>

<script>
// ─────────────────────────────────────────────────────────
//  KATEGORIEN  (hier neue Kategorien hinzufügen)

  {
    category: 'bewirtschaftung', icon: '📋', status: 'doc', automation: 65, mvp: true,

    desc: 'Amtliches Formular aus BOS generieren, digitale Unterzeichnung aller Mietparteien, Sicherheitsleistung, Übergabe via Sorglosfee, 10-tägige Mängelfrist.',

  {

    name: 'Objekt-Onboarding',
    desc: 'Datenerhebung je Liegenschaft aus AV-Online, Geodaten, Grundrissen und Dokumenten. Vollständigkeitsprüfung aller Pflichtfelder für abhängige Prozesse (Debitoren, Kreditoren, NK-Abrechnung, Serviceverträge).',
  },
  {
    category: 'onboarding', icon: '👤', status: 'plan', automation: 70, mvp: true,
    name: 'Mieter-Onboarding', link: 'MieterOnboarding.html',
    desc: 'Maximale Portal-Registrierungsrate (Ziel ≥ 99%) via Multi-Channel-Strategie: Magic Link → SMS → Physischer Brief → HITL. Portal ist der einzige Kanal für NK-Abrechnung und Schadensmeldungen — starker Nutzungsanreiz.',

// ─────────────────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────────────────
const STATUS_LABEL = { doc:'Dokumentiert', dev:'In Entwicklung', plan:'Geplant' };
const STATUS_CLS   = { doc:'sb-doc', dev:'sb-dev', plan:'sb-plan' };

function avgAuto(list) {
  return Math.round(list.reduce((s,p) => s + p.automation, 0) / list.length);
}

function buildCard(p, cat) {
  const isDoc  = p.status === 'doc';
  const actor  = p.actor || cat.label;
  const linked = !!p.link;

  return `
  <div class="pCard${linked ? ' clickable' : ''}${isDoc ? ' doc-card' : ''}"
       style="--ac:${isDoc ? '#08ccab' : cat.color};--ac-rgb:${isDoc ? '8,204,171' : cat.rgb}"
       data-mvp="${p.mvp ? 'true' : 'false'}"
       ${linked ? `onclick="location.href='${p.link}'"` : ''}>
    <div class="ct">
      <div class="ci">${p.icon}</div>
      <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        ${p.sub  ? '<span class="sb sb-sub">Subprocess</span>' : ''}
        ${p.mvp ? '<span class="sb sb-mvp">MVP</span>' : ''}
        <span class="sb ${STATUS_CLS[p.status]}">${STATUS_LABEL[p.status]}</span>
      </div>
    </div>
    <div class="cn">${p.name}</div>
    <div class="cd">${p.desc}</div>
    <div class="abar">
      <div class="abar-track"><div class="abar-fill" style="width:${p.automation}%"></div></div>
      <span class="abar-pct">${p.automation} %</span>
    </div>
    <div class="cf">
      <span class="ab">${actor}</span>
      ${linked ? `<a class="vl" href="${p.link}">Prozess ansehen →</a>` : ''}
    </div>
  </div>`;
}

function render() {
  // Stats
  const doc  = PROCESSES.filter(p => p.status === 'doc').length;
  const dev  = PROCESSES.filter(p => p.status === 'dev').length;
  const plan = PROCESSES.filter(p => p.status === 'plan').length;
  const mvp  = PROCESSES.filter(p => p.mvp).length;
  const auto = avgAuto(PROCESSES);
  document.getElementById('s-total').textContent = PROCESSES.length;
  document.getElementById('s-doc').textContent   = doc;
  document.getElementById('s-dev').textContent   = dev;
  document.getElementById('s-plan').textContent  = plan;
  document.getElementById('s-mvp').textContent   = mvp;
  document.getElementById('s-auto').textContent  = auto + ' %';
  document.getElementById('hd-meta').textContent = `${PROCESSES.length} Prozesse · ${CATEGORIES.length} Akteure`;

  // Filter buttons
  const filterEl = document.getElementById('filter');
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'fb';
    btn.dataset.f = cat.id;
    btn.onclick = () => setFilter(cat.id, btn);
    btn.innerHTML = `<span class="fd" style="background:${cat.color}"></span>${cat.label.replace(/-Prozesse|Prozesse/,'').trim()}`;
    filterEl.appendChild(btn);
  });

  // Sections
  const content = document.getElementById('content');
  CATEGORIES.forEach(cat => {
    const procs = PROCESSES.filter(p => p.category === cat.id);
    if (!procs.length) return;
    const avg = avgAuto(procs);
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.dataset.cat = cat.id;
    section.innerHTML = `
      <div class="cat-header">
        <span class="code-badge"># ${cat.code}</span>
        <h3 class="text-sm font-bold tracking-widest uppercase" style="color:var(--color-vision);letter-spacing:2px">${cat.label}</h3>
        <span class="cat-count">${procs.length}</span>
        <span class="cat-auto">Ø ${avg} % automatisiert</span>
      </div>
      <div class="pGrid">${procs.map(p => buildCard(p, cat)).join('')}</div>`;
    content.appendChild(section);
  });
}

// ─────────────────────────────────────────────────────────
//  FILTER
// ─────────────────────────────────────────────────────────
function setFilter(f, btn) {
  document.querySelectorAll('.fb').forEach(b => {
    b.classList.remove('active');
    b.style.background = b.style.borderColor = b.style.color = '';
  });
  btn.classList.add('active');
  const cat = CATEGORIES.find(c => c.id === f);
  if (f === 'mvp') {
    btn.style.background  = 'rgba(245,158,11,0.18)';
    btn.style.borderColor = 'rgba(245,158,11,0.5)';
    btn.style.color       = '#f59e0b';
  } else if (cat) {
    btn.style.background   = cat.color + '22';
    btn.style.borderColor  = cat.color + '66';
    btn.style.color        = '#fff';
  } else {
    btn.style.background  = 'rgba(255,255,255,0.12)';
    btn.style.borderColor = 'rgba(255,255,255,0.25)';
    btn.style.color       = '#fff';
  }
  // reset card-level fhide first
  document.querySelectorAll('.pCard').forEach(c => c.classList.remove('fhide'));

  if (f === 'mvp') {
    document.querySelectorAll('.pCard').forEach(c => {
      if (c.dataset.mvp !== 'true') c.classList.add('fhide');
    });
    document.querySelectorAll('.cat-section').forEach(sec => {
      const hasVisible = sec.querySelectorAll('.pCard:not(.fhide)').length > 0;
      sec.classList.toggle('fhide', !hasVisible);
    });
  } else {
    document.querySelectorAll('.cat-section').forEach(sec => {
      sec.classList.toggle('fhide', f !== 'all' && sec.dataset.cat !== f);
    });
  }
}

render();
lucide.createIcons();
</script>
