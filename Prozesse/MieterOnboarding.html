<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozess · REC Space Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg-base:#060b1a;--bg-radial-center:#0a1128;--bg-radial-edge:#03060f;--color-vision:#08ccab;--color-gold:#f59e0b;--color-cyan:#0ea5e9}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;background:var(--bg-base);background-image:radial-gradient(circle at 50% 20%,var(--bg-radial-center) 0%,var(--bg-radial-edge) 100%);min-height:100vh}
h1,h2,h3,h4{color:#f8fafc;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.text-gradient{background:linear-gradient(130deg,#f43f5e 20%,#f97316 55%,#f59e0b 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.glow{text-shadow:0 0 30px rgba(255,255,255,.25)}
.code-badge{background:rgba(99,156,255,.10);border:1px solid rgba(99,156,255,.20);color:#93c5fd;padding:.18rem .65rem;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:.78rem;display:inline-block}
#topbar{padding:18px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.back-link{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#64748b;text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--color-vision)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace}
.breadcrumb span{color:#475569}
.bc-active{color:var(--color-vision) !important}
#hero{padding:32px 56px 24px;border-bottom:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:300px;background:radial-gradient(ellipse,rgba(244,63,94,.06) 0%,transparent 60%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);background:rgba(8,204,171,.10);padding:4px 12px;border-radius:9999px;border:1px solid rgba(8,204,171,.22);font-family:'JetBrains Mono',monospace}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--color-vision);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 10px;border-radius:9999px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.sb-doc{background:rgba(8,204,171,.15);color:#08ccab;border:1px solid rgba(8,204,171,.3)}
.sb-plan{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.08)}
.sb-mvp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.35)}
#tab-nav{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.5);backdrop-filter:blur(10px);padding:0 56px;position:sticky;top:60px;z-index:90}
.tab-btn{padding:14px 24px;font-size:13px;font-weight:600;color:#475569;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:'Segoe UI',sans-serif}
.tab-btn:hover{color:#94a3b8}
.tab-btn.active{color:var(--color-vision);border-bottom-color:var(--color-vision)}
.tab-btn i{width:15px;height:15px}
.tab-panel{display:none;padding:40px 56px 80px}
.tab-panel.active{display:block}
#svg-wrapper{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(8,204,171,.08), 0 24px 64px rgba(0,0,0,.6)}
#svg-container{width:100%;min-height:560px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#svg-placeholder{text-align:center;padding:60px 40px}
.svg-hint{font-family:'JetBrains Mono',monospace;font-size:12px;color:#334155;margin-top:20px;line-height:2;text-align:left;display:inline-block}
.svg-hint span{color:var(--color-vision)}
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.prose{font-size:13px;color:#94a3b8;line-height:1.8;margin-bottom:28px}
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px}
.actor-card{background:rgba(10,15,30,.65);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.actor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.actor-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:2px}
.actor-role{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.actor-resp{font-size:11px;color:#64748b;line-height:1.6}
/* Channel Strategy */
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:32px}
.channel-card{background:rgba(10,15,30,.55);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.channel-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc)}
.channel-num{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(var(--cc-rgb),1);margin-bottom:4px}
.channel-title{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.channel-trigger{font-size:11px;color:#64748b;line-height:1.5}
.channel-rate{font-size:10px;font-weight:700;color:#10b981;font-family:'JetBrains Mono',monospace;margin-top:8px}
/* Phase */
.phases-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:32px}
.phase-card{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.phase-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02)}
.phase-num{min-width:32px;height:26px;padding:0 8px;border-radius:6px;background:rgba(var(--pc-rgb),.2);border:1px solid rgba(var(--pc-rgb),.4);color:var(--pc);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.phase-title{font-size:13px;font-weight:700;color:#f1f5f9}
.phase-par{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#475569;font-family:'JetBrains Mono',monospace;margin-left:auto;border:1px solid rgba(255,255,255,.08);padding:2px 8px;border-radius:9999px}
.phase-body{padding:16px 20px}
.step-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#94a3b8;line-height:1.6}
.step-n{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#475569;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-family:'JetBrains Mono',monospace}
.step-main{font-weight:600;color:#cbd5e1}
.step-branches{margin-top:6px;padding-left:4px;display:flex;flex-direction:column;gap:4px}
.branch{font-size:11px;display:flex;gap:6px;align-items:flex-start}
.branch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.branch-yes{background:#10b981}
.branch-no{background:#f43f5e}
.branch-alt{background:#f59e0b}
.branch-text{color:#64748b}
.branch-condition{font-weight:600;color:#94a3b8}
/* Attr */
.attr-section{margin-bottom:32px}
.attr-section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attr-section-num{width:24px;height:24px;border-radius:6px;background:rgba(var(--asc-rgb),.2);border:1px solid rgba(var(--asc-rgb),.35);color:var(--asc);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.attr-section-title{font-size:13px;font-weight:700;color:#f1f5f9}
.attr-section-sub{font-size:10px;color:#475569;font-family:'JetBrains Mono',monospace}
table{width:100%;border-collapse:collapse;background:rgba(10,15,30,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
thead th{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#475569;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-family:'JetBrains Mono',monospace}
tbody td{padding:9px 14px;font-size:12px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.td-attr{font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd}
.td-type{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b}
.req-yes{color:#10b981;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.req-no{color:#334155;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.enum-section{margin-bottom:28px}
.enum-title{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px}
.enum-block{background:rgba(10,15,30,.7);border:1px solid rgba(99,156,255,.15);border-radius:8px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd;line-height:2}
.enum-val{display:inline-block;background:rgba(99,156,255,.08);border:1px solid rgba(99,156,255,.15);border-radius:4px;padding:1px 7px;margin:2px 3px;color:#93c5fd}
.val-table table{margin-top:0}
/* Rate bar */
.rate-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.rate-fill{height:100%;border-radius:2px;background:#10b981}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
</style>
</head>
<body>

<div id="topbar">
  <div class="breadcrumb">
    <a href="prozesslandkarte.html" class="back-link">
      <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
      Prozesslandkarte
    </a>
    <span style="color:#1e293b">/</span>
    <span id="bc-cat"></span>
    <span style="color:#1e293b">/</span>
    <span id="bc-name" class="bc-active"></span>
  </div>
  <div class="code-badge" id="topbar-version"></div>
</div>

<div id="hero">
  <div id="hero-tag" class="hero-tag"><span class="hd-dot"></span></div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:4px">
    <div>
      <h1 id="hero-title" class="text-3xl font-bold text-gradient glow" style="margin-bottom:8px"></h1>
      <p id="hero-desc" class="text-sm" style="color:#64748b;max-width:680px;line-height:1.7"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:7px;align-items:center" id="hero-badges"></div>
      <div style="display:flex;gap:16px;align-items:center" id="hero-meta"></div>
    </div>
  </div>
</div>

<nav id="tab-nav">
  <button class="tab-btn active" onclick="showTab('prozess',this)">
    <i data-lucide="git-branch"></i> Prozess
  </button>
  <button class="tab-btn" onclick="showTab('doku',this)">
    <i data-lucide="file-text"></i> Dokumentation
  </button>
  <button class="tab-btn" onclick="showTab('attr',this)">
    <i data-lucide="database"></i> Attributkatalog
  </button>
</nav>

<div class="tab-panel active" id="tab-prozess">
  <div id="svg-wrapper">
  <div id="svg-container">
    <div id="svg-placeholder">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <i data-lucide="git-fork" style="width:28px;height:28px;color:#334155"></i>
      </div>
      <p style="font-size:14px;font-weight:700;color:#475569;margin-bottom:6px">BPMN-Diagramm</p>
      <p style="font-size:12px;color:#334155;margin-bottom:20px">SVG-Export hier einfügen</p>
      <div class="svg-hint">diagramSrc: <span>'bpmn_MieterOnboarding.svg'</span></div>
    </div>
  </div>
  </div>
</div>

<div class="tab-panel" id="tab-doku">
  <div style="max-width:900px">
    <div class="section-title">Prozessübersicht</div>
    <p class="prose" id="doc-overview"></p>
    <div class="section-title">99%-Strategie: Multi-Channel-Einladung</div>
    <div class="channel-grid" id="doc-channels"></div>
    <div class="section-title">Beteiligte Akteure</div>
    <div class="actor-grid" id="doc-actors"></div>
    <div class="section-title">Prozessablauf</div>
    <div class="phases-grid" id="doc-phases"></div>
  </div>
</div>

<div class="tab-panel" id="tab-attr">
  <div style="max-width:1100px">
    <div id="attr-sections"></div>
    <div class="section-title" style="margin-top:40px">Enum-Definitionen</div>
    <div id="attr-enums"></div>
    <div class="section-title" style="margin-top:32px">Validierungsregeln</div>
    <div class="val-table" id="attr-validations"></div>
  </div>
</div>

<script>
const PROCESS_DATA = {

  name:          'Mieter-Onboarding',
  nameEn:        'Tenant Onboarding',
  category:      'On- & Offboarding Factory',
  categoryColor: '#f43f5e',
  categoryRgb:   '244,63,94',
  status:        'doc',
  mvp:           true,
  automation:    70,
  version:       '1.0',
  backLink:      'prozesslandkarte.html',

  diagramSrc:    'bpmn_MieterOnboarding.svg',
  diagramInline: null,

  overview: 'Mieter-Onboarding wird automatisch getriggert, sobald ein Mieter im BOS bekannt ist — sei es durch die Vorverwalter-Übergabe im Mandat-Onboarding oder durch einen neuen Mietvertrag. Ziel: maximale Portal-Registrierungsrate (Ziel: ≥ 99%). Das Portal ist der einzige Kanal für NK-Abrechnungen, Schadensmeldungen und Kommunikation — das schafft einen starken Nutzungsanreiz. Der Prozess läuft vollständig automatisiert über eine sequenzielle Multi-Channel-Strategie: E-Mail (Magic Link) → SMS → Physischer Brief mit QR-Code → HITL-Eskalation an Bewirtschaftung. Erst wenn der Mieter Portal-Mitglied ist, sind alle nachgelagerten Prozesse (Mahnwesen, Schadensmeldung, NK-Abrechnung) vollständig betriebsbereit.',

  channels: [
    {
      num: 'Kanal 1 · Tag 0',
      title: 'E-Mail — Magic Link',
      trigger: 'Sofort nach Mieter-Erfassung im BOS. Persönlicher Magic Link — kein Passwort, kein App-Download nötig. Geführter Welcome-Wizard: Profil bestätigen, Zahlungskanal wählen, Portal erkunden.',
      rate: 'Ziel: 60–70% Registrierungen via Kanal 1',
      color: '#4a8fff', rgb: '74,143,255',
    },
    {
      num: 'Kanal 2 · Tag 3',
      title: 'SMS — Direktlink',
      trigger: 'Wenn E-Mail nach 48h nicht geöffnet. Kurze SMS mit persönlichem Kurzlink. Nur wenn Mobilnummer vorhanden; sonst direkt zu Kanal 3.',
      rate: 'Ziel: +15% kumuliert via Kanal 2',
      color: '#a855f7', rgb: '168,85,247',
    },
    {
      num: 'Kanal 3 · Tag 7',
      title: 'Physischer Brief — QR-Code',
      trigger: 'Wenn keine Portal-Registrierung nach 7 Tagen. Personalisiertes Begrüssungsschreiben mit QR-Code und Erklärung der Portal-Vorteile. Enthält expliziten Hinweis: NK-Abrechnung und Schadensmeldung ausschliesslich über Portal.',
      rate: 'Ziel: +10% kumuliert via Kanal 3',
      color: '#0ea5e9', rgb: '14,165,233',
    },
    {
      num: 'Kanal 4 · Tag 14+',
      title: 'HITL — Bewirtschaftung',
      trigger: 'Wenn nach 14 Tagen keine Registrierung trotz 3 Kanälen. Bewirtschaftung kontaktiert Mieter direkt (Telefon/persönlich), erklärt Portal und assistiert beim Login. Letztes Mittel: Bewirtschaftung erstellt stellvertretend ein Basis-Profil.',
      rate: 'Ziel: 99%+ Gesamt-Coverage',
      color: '#f59e0b', rgb: '245,158,11',
    },
  ],

  actors: [
    { name:'Agent Swarms',   role:'Automatisierung · Reminder · Monitoring', color:'#4a8fff', rgb:'74,143,255', responsibilities:'Einladung und alle Reminder automatisch versenden; Öffnungs- und Klick-Tracking auswerten; Eskalations-Trigger auslösen; Portal-Aktivierung im BOS setzen sobald Login erfolgt' },
    { name:'Mieter',         role:'Empfänger · Portal-Registrierung',         color:'#a855f7', rgb:'168,85,247', responsibilities:'Magic Link öffnen und Portal-Login abschliessen; Welcome-Wizard durchlaufen (Profil, Zahlungskanal, Kommunikationspräferenzen); Dokumente (Mietvertrag) im Portal einsehen' },
    { name:'Bewirtschaftung',role:'HITL-Eskalation · Assistiertes Onboarding', color:'#0ea5e9', rgb:'14,165,233', responsibilities:'Bei fehlender Registrierung nach 14 Tagen: Mieter direkt kontaktieren; beim Login assistieren; im Ausnahmefall stellvertretendes Basis-Profil erstellen und Mieter nachträglich schulen' },
  ],

  phases: [
    {
      num:'1', title:'Phase 1: Trigger & Einladung',
      color:'#4a8fff', rgb:'74,143,255', parallel: false,
      steps:[
        { n:1, main:'Trigger: Mieter im BOS bekannt', desc:'Prozess startet automatisch sobald ein Mieter-Datensatz angelegt wird — entweder durch Vorverwalter-Übergabe (Mandat-Onboarding Phase 3), durch Neu-Mietvertrag (Mieter-Wechselprozess) oder durch manuellen Import.', branches:[
          { type:'alt', condition:'Quelle: Vorverwalter-Übergabe', result:'Bestehender Mieter, evtl. bereits mit E-Mail und Mobilnummer bekannt' },
          { type:'alt', condition:'Quelle: Neu-Mietvertrag',       result:'Neuer Mieter, Kontaktdaten aus Mietvertrag-Unterzeichnung' },
        ]},
        { n:2, main:'Kontaktdaten prüfen', desc:'Agent prüft ob E-Mail-Adresse und/oder Mobilnummer vorhanden.', branches:[
          { type:'yes', condition:'E-Mail vorhanden', result:'Kanal 1 (E-Mail) starten; Parallelcheck auf Mobilnummer für Kanal 2' },
          { type:'no',  condition:'Nur Post-Adresse', result:'Direkt zu Kanal 3 (Brief); kein Kanal 1 & 2' },
        ]},
        { n:3, main:'Magic Link generieren und E-Mail senden (Kanal 1)', desc:'Agent generiert einen personalisierten, zeitlich limitierten Magic Link (TTL: 30 Tage) und sendet eine personalisierte Willkommens-E-Mail. Inhalt: Portalzweck, was der Mieter dort findet, Schritt-für-Schritt-Anleitung. Öffnungs- und Klick-Zeitstempel werden getrackt.' },
      ],
    },
    {
      num:'2', title:'Phase 2: Reminder-Sequenz',
      color:'#a855f7', rgb:'168,85,247', parallel: false,
      steps:[
        { n:1, main:'D+2: E-Mail-Status prüfen', desc:'Agent prüft ob E-Mail geöffnet wurde.', branches:[
          { type:'yes', condition:'E-Mail geöffnet, kein Login', result:'Reminder-E-Mail in 3 Tagen (Kanal 1, Reminder 2)' },
          { type:'no',  condition:'E-Mail nicht geöffnet', result:'SMS-Reminder auslösen falls Mobilnummer vorhanden (Kanal 2)' },
        ]},
        { n:2, main:'D+3: SMS-Reminder (Kanal 2)', desc:'Agent sendet SMS mit Kurzlink wenn keine E-Mail-Öffnung und Mobilnummer vorhanden. Nachricht ist kurz und persönlich: Name, Objektadresse, direkter Kurzlink. Delivery-Status und Klick werden getrackt.' },
        { n:3, main:'D+7: Portal-Status prüfen', desc:'Agent prüft ob Portal-Registrierung erfolgt ist.', branches:[

          { type:'no',  condition:'Nicht registriert', result:'Physischen Brief auslösen (Kanal 3)' },
        ]},
        { n:4, main:'D+7: Physischer Brief mit QR-Code (Kanal 3)', desc:'Agent triggert automatisierte Brieferstellung und -versand. Inhalt: Persönliche Ansprache, Portal-Erklärung in einfacher Sprache, grosser QR-Code mit personalem Link, wichtiger Hinweis: "NK-Abrechnung und Schadensmeldungen werden ausschliesslich über das Mieterportal abgewickelt."' },
      ],
    },
    {
      num:'3', title:'Phase 3: Portal-Aktivierung',
      color:'#10b981', rgb:'16,185,129', parallel: false,
      steps:[
        { n:1, main:'Magic Link öffnen und Login abschliessen', desc:'Mieter öffnet Magic Link via beliebigem Kanal. Erster Login setzt portal_aktiviert = true und portal_aktiviert_at im BOS. Agent sendet automatische Bestätigungs-E-Mail.' },
        { n:2, main:'Welcome-Wizard durchlaufen', desc:'Geführter 4-Schritte-Wizard im Portal:', branches:[
          { type:'alt', condition:'Schritt 1 — Profil',          result:'Kontaktdaten bestätigen, Sprache wählen, Benachrichtigungs-Präferenzen setzen' },
          { type:'alt', condition:'Schritt 2 — Zahlungskanal',   result:'IBAN für NK-Rückerstattungen, Präferenz E-Rechnung/Post' },
          { type:'alt', condition:'Schritt 3 — Besichtigungstermin', result:'"Wir möchten Sie und Ihre Wohnung kennenlernen" — Mieter wählt eines von 3 Zeitfenstern für die Zustandsaufnahme. Incentive: Bestätigter Termin = Willkommens-Geschenk (Gutschein oder Kulanzmonat). Vorteil klar kommuniziert: Mieter kann sofort eigene Schäden melden, eigenes Zustandsprotokoll im Portal einsehen.' },
          { type:'alt', condition:'Schritt 4 — Entdecken',       result:'Mietvertrag einsehen, Ansprechpartner kennenlernen, Schadensmeldung testen' },
        ]},
        { n:3, main:'Mieter-Onboarding abschliessen', desc:'Nach Wizard-Abschluss: mieter_onboarding_abgeschlossen_at gesetzt. Agent meldet Abschluss an Mandat-Onboarding zurück. Alle abhängigen Prozesse (Mahnwesen, Schadensmeldung, NK-Abrechnung) sind nun für diesen Mieter voll betriebsbereit.' },
      ],
    },
    {
      num:'4', title:'Phase 4: HITL-Eskalation (Ausnahme)',
      color:'#f59e0b', rgb:'245,158,11', parallel: false,
      steps:[
        { n:1, main:'D+14: Eskalation an Bewirtschaftung', desc:'Wenn nach 14 Tagen und allen 3 Kanälen keine Registrierung: Agent eskaliert automatisch an Bewirtschaftung. Aufgabe: Mieter direkt kontaktieren (Telefon oder persönlich an Objekt).', branches:[
          { type:'yes', condition:'Mieter kooperiert', result:'Bewirtschaftung assistiert beim Login; Mieter schliessst Wizard ab' },
          { type:'no',  condition:'Mieter nicht erreichbar / verweigert', result:'Bewirtschaftung dokumentiert; prüft ob Mieter-Adresse korrekt; ggf. erneuter Brief' },
        ]},
        { n:2, main:'Stellvertretendes Basis-Profil (letzter Ausweg)', desc:'Wenn Mieter trotz HITL nicht registrierbar (z.B. sehr hohe Altersgruppe, kein digitaler Zugang): Bewirtschaftung erstellt Basis-Profil stellvertretend. Mieter erhält physische Korrespondenz als Fallback-Kanal. Ausnahme wird in BOS dokumentiert (portal_ausnahme = true). Nachgelagerte Prozesse werden für postalischen Fallback konfiguriert.' },
      ],
    },
  ],

  attributes:[
    {
      n:1, section:'Mieter-Identifikation', sectionEn:'Tenant Identity',
      color:'#4a8fff', rgb:'74,143,255',
      fields:[
        { attr:'mieter_onboarding_id',  type:'String/UUID', req:true,  desc:'Eindeutige ID je Mieter-Onboarding-Instanz' },
        { attr:'mieter_id',             type:'String/UUID', req:true,  desc:'Referenz auf Mieter-Datensatz im BOS' },
        { attr:'mandat_id',             type:'String/UUID', req:true,  desc:'Referenz auf übergeordneten Mandat-Onboarding-Prozess' },
        { attr:'mietvertrag_id',        type:'String/UUID', req:true,  desc:'Referenz auf Mietvertrag (Quelle der Mieter-Daten)' },
        { attr:'trigger_quelle',        type:'Enum',        req:true,  desc:'Quelle des Triggers: VORVERWALTER_UEBERGABE oder NEU_MIETVERTRAG' },
        { attr:'status',                type:'Enum',        req:true,  desc:'Aktueller Onboarding-Status' },
        { attr:'created_at',            type:'DateTime',    req:true,  desc:'Zeitpunkt des Prozess-Starts' },
      ],
    },
    {
      n:2, section:'Kontaktdaten & Kanal-Status', sectionEn:'Contact Data & Channel Status',
      color:'#a855f7', rgb:'168,85,247',
      fields:[
        { attr:'email',                       type:'String',   req:false, desc:'E-Mail-Adresse des Mieters; Pflicht für Kanal 1' },
        { attr:'mobilnummer',                 type:'String',   req:false, desc:'Mobilnummer für SMS-Kanal (Kanal 2); +41-Format' },
        { attr:'postadresse_vollstaendig',    type:'Boolean',  req:true,  desc:'true wenn Briefadresse für Kanal 3 vorhanden' },
        { attr:'kanal1_einladung_at',         type:'DateTime', req:false, desc:'Zeitpunkt der E-Mail-Einladung (Kanal 1)' },
        { attr:'kanal1_geoeffnet_at',         type:'DateTime', req:false, desc:'Zeitpunkt der ersten E-Mail-Öffnung' },
        { attr:'kanal1_link_geklickt_at',     type:'DateTime', req:false, desc:'Zeitpunkt des Magic-Link-Klicks via E-Mail' },
        { attr:'kanal2_sms_at',               type:'DateTime', req:false, desc:'Zeitpunkt des SMS-Reminders (Kanal 2)' },
        { attr:'kanal2_link_geklickt_at',     type:'DateTime', req:false, desc:'Zeitpunkt des Link-Klicks via SMS' },
        { attr:'kanal3_brief_at',             type:'DateTime', req:false, desc:'Zeitpunkt der Briefauslösung (Kanal 3)' },
        { attr:'kanal3_brief_zugestellt_at',  type:'DateTime', req:false, desc:'Bestätigtes Zustelldatum via Post-API (wenn verfügbar)' },
        { attr:'hitl_eskalation_at',          type:'DateTime', req:false, desc:'Zeitpunkt der HITL-Eskalation an Bewirtschaftung (Kanal 4)' },
        { attr:'reminder_count',              type:'Integer',  req:false, desc:'Gesamtanzahl gesendeter Reminder über alle Kanäle' },
      ],
    },
    {
      n:3, section:'Portal-Aktivierung', sectionEn:'Portal Activation',
      color:'#10b981', rgb:'16,185,129',
      fields:[
        { attr:'magic_link_token',             type:'String',   req:false, desc:'Generierter Token; SHA-256 gehasht im BOS; TTL 30 Tage' },
        { attr:'magic_link_ttl_at',            type:'DateTime', req:false, desc:'Ablaufzeitpunkt des Magic Links; danach neuer Token' },
        { attr:'portal_aktiviert',             type:'Boolean',  req:true,  desc:'true wenn erster Login erfolgt' },
        { attr:'portal_aktiviert_at',          type:'DateTime', req:false, desc:'Zeitpunkt des ersten Portal-Logins' },
        { attr:'portal_aktiviert_via_kanal',   type:'Enum',     req:false, desc:'Via welchem Kanal die Aktivierung erfolgte: EMAIL / SMS / BRIEF / HITL' },
        { attr:'wizard_schritt',               type:'Integer',  req:false, desc:'Aktueller Wizard-Schritt (1–4); 4 = abgeschlossen' },
        { attr:'wizard_abgeschlossen_at',      type:'DateTime', req:false, desc:'Zeitpunkt des Wizard-Abschlusses' },
        { attr:'besichtigung_termin_at',       type:'DateTime', req:false, desc:'Vom Mieter gewählter Besichtigungstermin (aus Wizard Schritt 3)' },
        { attr:'besichtigung_incentive_typ',   type:'Enum',     req:false, desc:'Incentive-Typ bei bestätigtem Termin: GUTSCHEIN / KULANZMONAT / KEINES' },
        { attr:'besichtigung_termin_bestaetigt',type:'Boolean', req:false, desc:'true wenn Mieter Termin aktiv bestätigt hat (vs. nicht geantwortet)' },
        { attr:'iban_hinterlegt',              type:'Boolean',  req:false, desc:'true wenn Mieter IBAN für NK-Rückerstattungen hinterlegt hat' },
        { attr:'portal_ausnahme',              type:'Boolean',  req:false, desc:'true wenn stellvertretendes Profil durch Bewirtschaftung erstellt (kein echter Mieter-Login)' },
        { attr:'mieter_onboarding_abgeschlossen_at', type:'DateTime', req:false, desc:'Zeitpunkt der vollständigen Prozess-Abschluss (Login + Wizard)' },
      ],
    },
    {
      n:4, section:'Policies & Konfiguration', sectionEn:'Policies & Configuration',
      color:'#f59e0b', rgb:'245,158,11',
      fields:[
        { attr:'policy_reminder_intervall_tage', type:'Integer', req:true, desc:'Tage zwischen Reminder-Kanälen (Standard: 3–7–14)' },
        { attr:'policy_magic_link_ttl_tage',     type:'Integer', req:true, desc:'Gültigkeit des Magic Links in Tagen (Standard: 30)' },
        { attr:'policy_hitl_schwellwert_tage',   type:'Integer', req:true, desc:'Tage ohne Registrierung bis HITL-Eskalation (Standard: 14)' },
        { attr:'policy_max_reminder',            type:'Integer', req:true, desc:'Max. Anzahl automatischer Reminder vor HITL (Standard: 3)' },
      ],
    },
  ],

  enums:[
    { name:'Status', values:['AUSSTEHEND','EINLADUNG_VERSENDET','REMINDER_1','REMINDER_2','BRIEF_VERSENDET','HITL_ESKALATION','PORTAL_AKTIV','WIZARD_ABGESCHLOSSEN','ABGESCHLOSSEN','AUSNAHME'] },
    { name:'TriggerQuelle', values:['VORVERWALTER_UEBERGABE','NEU_MIETVERTRAG'] },
    { name:'AktiviertViaKanal', values:['EMAIL','SMS','BRIEF','HITL'] },
    { name:'BesichtigungIncentiveTyp', values:['GUTSCHEIN','KULANZMONAT','KEINES'] },
  ],

  validations:[
    { attr:'Trigger: Prozessstart',            rule:'mieter_id IS NOT NULL AND mietvertrag_id IS NOT NULL AND trigger_quelle IS NOT NULL' },
    { attr:'Kanal 1 → Kanal 2',               rule:'kanal1_geoeffnet_at IS NULL AND DATEDIFF(NOW(), kanal1_einladung_at) ≥ 2 AND mobilnummer IS NOT NULL' },
    { attr:'Kanal 2 → Kanal 3',               rule:'portal_aktiviert = false AND DATEDIFF(NOW(), created_at) ≥ 7' },
    { attr:'Kanal 3 → HITL',                  rule:'portal_aktiviert = false AND DATEDIFF(NOW(), created_at) ≥ policy_hitl_schwellwert_tage' },
    { attr:'Prozess abgeschlossen',           rule:'portal_aktiviert = true AND wizard_schritt = 3 (oder portal_ausnahme = true)' },
    { attr:'magic_link_token',                rule:'Muss SHA-256 gehasht gespeichert sein; TTL = policy_magic_link_ttl_tage; nach Ablauf: automatische Token-Erneuerung bei erstem erneuten Kanal-Kontakt' },
    { attr:'Callback an Mandat-Onboarding',   rule:'Nach mieter_onboarding_abgeschlossen_at: mieter_onboarding_ids[i].status = ABGESCHLOSSEN im übergeordneten Mandat-Prozess setzen' },
  ],
};

const P = PROCESS_DATA;
const STATUS_LABEL = { doc:'Dokumentiert', dev:'In Entwicklung', plan:'Geplant' };
const STATUS_CLS   = { doc:'sb-doc', dev:'sb-dev', plan:'sb-plan' };

function renderHero() {
  document.title = `${P.name} · REC Space Model`;
  document.getElementById('bc-cat').textContent  = P.category;
  document.getElementById('bc-name').textContent = P.name;
  document.getElementById('topbar-version').textContent = `v${P.version}`;
  const tag = document.getElementById('hero-tag');
  tag.innerHTML = `<span class="hd-dot"></span>${P.category}`;
  tag.style.color      = P.categoryColor;
  tag.style.background = `rgba(${P.categoryRgb},.10)`;
  tag.style.border     = `1px solid rgba(${P.categoryRgb},.22)`;
  document.getElementById('hero-title').textContent = P.name;
  document.getElementById('hero-desc').textContent  = P.overview;
  document.getElementById('hero-badges').innerHTML = `
    ${P.mvp ? '<span class="sb sb-mvp">MVP</span>' : ''}
    <span class="sb ${STATUS_CLS[P.status]}">${STATUS_LABEL[P.status]}</span>`;
  document.getElementById('hero-meta').innerHTML = `
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      <span style="color:var(--color-cyan);font-weight:700">${P.automation} %</span> automatisiert
    </span>
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      ${P.actors.length} Akteure
    </span>`;
}

function renderDiagram() {
  const container = document.getElementById('svg-container');
  if (P.diagramInline) { container.innerHTML = P.diagramInline; }
  else if (P.diagramSrc) {
    container.innerHTML = `<img src="${P.diagramSrc}" alt="BPMN Prozessdiagramm" style="width:100%;height:100%;object-fit:contain;padding:20px">`;
  }
}

function renderBranches(branches) {
  return `<div class="step-branches">${branches.map(b => `
    <div class="branch">
      <div class="branch-dot branch-${b.type}"></div>
      <div class="branch-text"><span class="branch-condition">${b.condition}:</span> ${b.result}</div>
    </div>`).join('')}</div>`;
}

function renderDoku() {
  document.getElementById('doc-overview').textContent = P.overview;

  document.getElementById('doc-channels').innerHTML = P.channels.map(ch => `
    <div class="channel-card" style="--cc:${ch.color};--cc-rgb:${ch.rgb}">
      <div class="channel-num">${ch.num}</div>
      <div class="channel-title">${ch.title}</div>
      <div class="channel-trigger">${ch.trigger}</div>
      <div class="rate-bar"><div class="rate-fill" style="background:${ch.color};width:${ch.color === '#4a8fff' ? '65%' : ch.color === '#a855f7' ? '80%' : ch.color === '#0ea5e9' ? '90%' : '99%'}"></div></div>
      <div class="channel-rate">${ch.rate}</div>
    </div>`).join('');

  document.getElementById('doc-actors').innerHTML = P.actors.map(a => `
    <div class="actor-card" style="--ac:${a.color}">
      <div class="actor-name">${a.name}</div>
      <div class="actor-role">${a.role}</div>
      <div class="actor-resp">${a.responsibilities}</div>
    </div>`).join('');

  document.getElementById('doc-phases').innerHTML = P.phases.map(ph => `
    <div class="phase-card">
      <div class="phase-header" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">
        <div class="phase-num" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">${ph.num}</div>
        <div class="phase-title">${ph.title}</div>
        ${ph.parallel ? '<span class="phase-par">Parallel</span>' : ''}
      </div>
      <div class="phase-body">
        <ul class="step-list">
          ${ph.steps.map(s => `
          <li class="step-item">
            <div class="step-n">${s.n}</div>
            <div>
              <span class="step-main">${s.main}</span>
              ${s.desc ? ` — ${s.desc}` : ''}
              ${s.branches ? renderBranches(s.branches) : ''}
            </div>
          </li>`).join('')}
        </ul>
      </div>
    </div>`).join('');
}

function renderAttr() {
  document.getElementById('attr-sections').innerHTML = P.attributes.map(sec => `
    <div class="attr-section">
      <div class="attr-section-header">
        <div class="attr-section-num" style="--asc:${sec.color};--asc-rgb:${sec.rgb}">${sec.n}</div>
        <div>
          <div class="attr-section-title">${sec.section}</div>
          <div class="attr-section-sub">${sec.sectionEn}</div>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>Attribut</th><th>Typ</th><th>Pflicht</th><th>Beschreibung</th>
        </tr></thead>
        <tbody>
          ${sec.fields.map(f => `
          <tr>
            <td class="td-attr">${f.attr}</td>
            <td class="td-type">${f.type}</td>
            <td>${f.req ? '<span class="req-yes">JA</span>' : '<span class="req-no">—</span>'}</td>
            <td>${f.desc}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');

  document.getElementById('attr-enums').innerHTML = P.enums.map(e => `
    <div class="enum-section">
      <div class="enum-title">${e.name}</div>
      <div class="enum-block">${e.values.map(v => `<span class="enum-val">${v}</span>`).join(' ')}</div>
    </div>`).join('');

  document.getElementById('attr-validations').innerHTML = `
    <table>
      <thead><tr><th>Attribut / Regel</th><th>Validierung</th></tr></thead>
      <tbody>
        ${P.validations.map(v => `
        <tr>
          <td class="td-attr">${v.attr}</td>
          <td>${v.rule}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

renderHero();
renderDiagram();
renderDoku();
renderAttr();
lucide.createIcons();
</script>
</body>
</html>
