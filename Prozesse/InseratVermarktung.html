<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozess · REC Space Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg-base:#060b1a;--bg-radial-center:#0a1128;--bg-radial-edge:#03060f;--color-vision:#08ccab;--color-gold:#f59e0b;--color-cyan:#0ea5e9}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;background:var(--bg-base);background-image:radial-gradient(circle at 50% 20%,var(--bg-radial-center) 0%,var(--bg-radial-edge) 100%);min-height:100vh}
h1,h2,h3,h4{color:#f8fafc;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.text-gradient{background:linear-gradient(130deg,#10b981 20%,#f59e0b 55%,#4a8fff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.glow{text-shadow:0 0 30px rgba(255,255,255,.25)}
.code-badge{background:rgba(99,156,255,.10);border:1px solid rgba(99,156,255,.20);color:#93c5fd;padding:.18rem .65rem;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:.78rem;display:inline-block}
#topbar{padding:18px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.back-link{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#64748b;text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--color-vision)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace}
.breadcrumb span{color:#475569}
.bc-active{color:var(--color-vision) !important}
#hero{padding:32px 56px 24px;border-bottom:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:300px;background:radial-gradient(ellipse,rgba(14,165,233,.06) 0%,transparent 60%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);background:rgba(8,204,171,.10);padding:4px 12px;border-radius:9999px;border:1px solid rgba(8,204,171,.22);font-family:'JetBrains Mono',monospace}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--color-vision);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 10px;border-radius:9999px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.sb-doc{background:rgba(8,204,171,.15);color:#08ccab;border:1px solid rgba(8,204,171,.3)}
.sb-dev{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.sb-plan{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.08)}
.sb-mvp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.35)}
#tab-nav{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.5);backdrop-filter:blur(10px);padding:0 56px;position:sticky;top:60px;z-index:90}
.tab-btn{padding:14px 24px;font-size:13px;font-weight:600;color:#475569;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:'Segoe UI',sans-serif}
.tab-btn:hover{color:#94a3b8}
.tab-btn.active{color:var(--color-vision);border-bottom-color:var(--color-vision)}
.tab-btn i{width:15px;height:15px}
.tab-panel{display:none;padding:40px 56px 80px}
.tab-panel.active{display:block}
#svg-wrapper{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(8,204,171,.08), 0 24px 64px rgba(0,0,0,.6)}
#svg-container{width:100%;min-height:560px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#svg-placeholder{text-align:center;padding:60px 40px}
.svg-hint{font-family:'JetBrains Mono',monospace;font-size:12px;color:#334155;margin-top:20px;line-height:2;text-align:left;display:inline-block}
.svg-hint span{color:var(--color-vision)}
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.prose{font-size:13px;color:#94a3b8;line-height:1.8;margin-bottom:28px}
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px}
.actor-card{background:rgba(10,15,30,.65);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.actor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.actor-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:2px}
.actor-role{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.actor-resp{font-size:11px;color:#64748b;line-height:1.6}
.phases-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:32px}
.phase-card{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.phase-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02)}
.phase-num{min-width:32px;height:26px;padding:0 8px;border-radius:6px;background:rgba(var(--pc-rgb),.2);border:1px solid rgba(var(--pc-rgb),.4);color:var(--pc);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.phase-title{font-size:13px;font-weight:700;color:#f1f5f9}
.phase-body{padding:16px 20px}
.step-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#94a3b8;line-height:1.6}
.step-n{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#475569;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-family:'JetBrains Mono',monospace}
.step-main{font-weight:600;color:#cbd5e1}
.step-branches{margin-top:6px;padding-left:4px;display:flex;flex-direction:column;gap:4px}
.branch{font-size:11px;display:flex;gap:6px;align-items:flex-start}
.branch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.branch-yes{background:#10b981}
.branch-no{background:#f43f5e}
.branch-alt{background:#f59e0b}
.branch-text{color:#64748b}
.branch-condition{font-weight:600;color:#94a3b8}
.attr-section{margin-bottom:32px}
.attr-section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attr-section-num{width:24px;height:24px;border-radius:6px;background:rgba(var(--asc-rgb),.2);border:1px solid rgba(var(--asc-rgb),.35);color:var(--asc);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.attr-section-title{font-size:13px;font-weight:700;color:#f1f5f9}
.attr-section-sub{font-size:10px;color:#475569;font-family:'JetBrains Mono',monospace}
table{width:100%;border-collapse:collapse;background:rgba(10,15,30,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
thead th{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#475569;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-family:'JetBrains Mono',monospace}
tbody td{padding:9px 14px;font-size:12px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.td-attr{font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd}
.td-type{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b}
.req-yes{color:#10b981;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.req-no{color:#334155;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.enum-section{margin-bottom:28px}
.enum-title{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px}
.enum-block{background:rgba(10,15,30,.7);border:1px solid rgba(99,156,255,.15);border-radius:8px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd;line-height:2}
.enum-val{display:inline-block;background:rgba(99,156,255,.08);border:1px solid rgba(99,156,255,.15);border-radius:4px;padding:1px 7px;margin:2px 3px;color:#93c5fd}
.val-table table{margin-top:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
</style>
</head>
<body>

<div id="topbar">
  <div class="breadcrumb">
    <a href="prozesslandkarte.html" class="back-link">
      <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
      Prozesslandkarte
    </a>
    <span style="color:#1e293b">/</span>
    <span id="bc-cat"></span>
    <span style="color:#1e293b">/</span>
    <span id="bc-name" class="bc-active"></span>
  </div>
  <div class="code-badge" id="topbar-version"></div>
</div>

<div id="hero">
  <div id="hero-tag" class="hero-tag"><span class="hd-dot"></span></div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:4px">
    <div>
      <h1 id="hero-title" class="text-3xl font-bold text-gradient glow" style="margin-bottom:8px"></h1>
      <p id="hero-desc" class="text-sm" style="color:#64748b;max-width:680px;line-height:1.7"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:7px;align-items:center" id="hero-badges"></div>
      <div style="display:flex;gap:16px;align-items:center" id="hero-meta"></div>
    </div>
  </div>
</div>

<nav id="tab-nav">
  <button class="tab-btn active" onclick="showTab('prozess',this)">
    <i data-lucide="git-branch"></i> Prozess
  </button>
  <button class="tab-btn" onclick="showTab('doku',this)">
    <i data-lucide="file-text"></i> Dokumentation
  </button>
  <button class="tab-btn" onclick="showTab('attr',this)">
    <i data-lucide="database"></i> Attributkatalog
  </button>
</nav>

<div class="tab-panel active" id="tab-prozess">
  <div id="svg-wrapper">
  <div id="svg-container">
    <div id="svg-placeholder">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <i data-lucide="git-fork" style="width:28px;height:28px;color:#334155"></i>
      </div>
      <p style="font-size:14px;font-weight:700;color:#475569;margin-bottom:6px">BPMN-Diagramm</p>
      <p style="font-size:12px;color:#334155;margin-bottom:20px">SVG-Export hier einfügen</p>
      <div class="svg-hint">diagramSrc: <span>'bpmn_InseratVermarktung.svg'</span></div>
    </div>
  </div>
  </div>
</div>

<div class="tab-panel" id="tab-doku">
  <div style="max-width:900px">
    <div class="section-title">Prozessübersicht</div>
    <p class="prose" id="doc-overview"></p>
    <div class="section-title">Beteiligte Akteure</div>
    <div class="actor-grid" id="doc-actors"></div>
    <div class="section-title">Prozessablauf</div>
    <div class="phases-grid" id="doc-phases"></div>
  </div>
</div>

<div class="tab-panel" id="tab-attr">
  <div style="max-width:1100px">
    <div id="attr-sections"></div>
    <div class="section-title" style="margin-top:40px">Enum-Definitionen</div>
    <div id="attr-enums"></div>
    <div class="section-title" style="margin-top:32px">Validierungsregeln</div>
    <div class="val-table" id="attr-validations"></div>
  </div>
</div>

<script>
const PROCESS_DATA = {

  name:          'Inserat & Vermarktung',
  nameEn:        'Listing & Marketing',
  category:      'Bewirtschaftung',
  categoryColor: '#0ea5e9',
  categoryRgb:   '14,165,233',
  status:        'doc',
  mvp:           true,
  automation:    75,
  version:       '1.0',
  backLink:      'prozesslandkarte.html',

  diagramSrc:    'bpmn_InseratVermarktung.svg',
  diagramInline: null,

  overview: 'Inserat & Vermarktung deckt den gesamten Vermarktungszyklus einer Wohnung ab — von der Inseratserstellung bis zur Mieterauswahl und Zusage. Der Prozess wird ausgelöst durch eine Kündigung (Wiedervermietung), Leerstand oder Erstvermietung. Agent Swarms erstellen das Inserat automatisch aus dem Knowledge Graph, publizieren es via Flatfox auf allen relevanten Portalen (ImmoScout24, Homegate, Mieterportal) und verarbeiten eingehende Anfragen digital. Die Mieterauswahl erfolgt standardmässig vollautomatisch (Auto-Entscheid); per Owner-Policy kann der Eigentümer aktiv aus den Top-3 Kandidaten wählen. Absagen werden bis zur Vertragsunterzeichnung zurückgehalten.',

  actors: [
    { name:'Agent Swarms',    role:'Inserat & Automatisierung', color:'#4a8fff', rgb:'74,143,255',   responsibilities:'Inserat generieren aus Knowledge Graph und Marktdaten, Flatfox-Publikation, Anfragen verarbeiten, Scoring & Ranking, Auto-Entscheid, Verifikationen auslösen, Absagen senden nach Vertragsunterzeichnung' },
    { name:'Bewirtschaftung', role:'Koordination & Besichtigung', color:'#0ea5e9', rgb:'14,165,233', responsibilities:'Inserat freigeben, Besichtigung koordinieren falls Wohnung leer, Mieterauswahl Review (bei Eigentümer-Entscheid), Zusage kommunizieren' },
    { name:'Eigentümer',      role:'Richtlinien & opt. Entscheid', color:'#10b981', rgb:'16,185,129', responsibilities:'Belegungskriterien definieren (Owner-Policy), optional Mieterauswahl aus Top-3 Kandidaten treffen (policy_eigentümer_entscheid)' },
    { name:'Mieter (neu)',    role:'Bewerber',                    color:'#a855f7', rgb:'168,85,247',  responsibilities:'Anfrage stellen, Selbstauskunft ausfüllen, Besichtigung wahrnehmen, Verifikationsdokumente bereitstellen' },
  ],

  flatfox: [
    { name:'Flatfox / SMG', icon:'🏠', color:'#4a8fff', rgb:'74,143,255',  desc:'Primäre Insertionsplattform — Teil von SMG Swiss Marketplace Group. Eine Integration deckt Flatfox, ImmoScout24 und Homegate gleichzeitig ab.' },
    { name:'CRIF',          icon:'📊', color:'#f59e0b', rgb:'245,158,11',  desc:'Bonitätsabfrage (Betreibungsauszug, FICO-Score) — automatisch ausgelöst nach Bewerbungseingang.' },
  ],

  phases: [
    {
      num:'1', title:'Phase 1: Auslösung & Vorbereitung',
      color:'#0ea5e9', rgb:'14,165,233',
      steps:[
        { n:1, main:'Trigger', desc:'Drei mögliche Eintrittspunkte:', branches:[
          { type:'yes', condition:'Kündigung (Wiedervermietung)', result:'Folge-Prozess aus Kündigung — Kündigungsdatum, aktuelle Mieterdaten und bereits erhobene Besichtigungs-Timeslots des Vormieters werden übergeben (kuendigung_ref_id)' },
          { type:'alt', condition:'Leerstand', result:'Wohnung bereits frei — kein Vormieter; Besichtigung über Bewirtschaftung oder Sorglosfee' },
          { type:'alt', condition:'Erstvermietung', result:'Neubau oder erstmalige Vermietung — erstvermietung_flag = true; Belegungskriterien werden neu definiert' },
        ]},
        { n:2, main:'Belegungskriterien laden', desc:'Agent liest Owner-Policy: Maximale Anzahl Bewerbungen für Eigentümer-Review, Auto-Entscheid aktiviert ja/nein, Mindestbonitätsanforderungen, policy_eigentümer_entscheid (Top-3 Auswahl durch Eigentümer aktiv oder inaktiv)' },
      ],
    },
    {
      num:'2', title:'Phase 2: Inserat erstellen',
      color:'#4a8fff', rgb:'74,143,255',
      steps:[
        { n:1, main:'Knowledge Graph abrufen', desc:'Agent zieht alle relevanten Objektdaten aus dem REC/BOS: Grundriss, Fläche, Zimmer, Ausstattung, Adresse, ÖV-Anbindung, Fotos/3D-Tour (als Dokument-Referenzen im BOS hinterlegt)' },
        { n:2, main:'Marktdatenabgleich', desc:'Vergleich mit aktuellen Marktmieten (Region, Lage, Baujahr, Ausstattung) zur Plausibilisierung des Mietpreises — Agent schlägt optimalen Ansatz vor' },
        { n:3, main:'Inserat generieren', desc:'Vollständiger Inseratstext (DE), Mietpreis, Nebenkosten, Verfügbarkeitsdatum, Fotos und Grundriss — automatisch aus Knowledge Graph' },
        { n:4, main:'Freigabe', desc:'Bewirtschaftung prüft Inserat kurz (Vollständigkeit, Mietpreis) und gibt frei — bei Erstvermietung optionaler Eigentümer-Review', branches:[
          { type:'yes', condition:'Freigegeben', result:'Weiter zur Publikation' },
          { type:'no',  condition:'Korrektur nötig', result:'Agent korrigiert Inserat — erneute Freigabe' },
        ]},
      ],
    },
    {
      num:'3', title:'Phase 3: Publikation & Vermarktung',
      color:'#4a8fff', rgb:'74,143,255',
      steps:[
        { n:1, main:'Publikation', desc:'Agent publiziert Inserat auf allen gängigen Insertionsplattformen (Flatfox → ImmoScout24, Homegate und weitere). Status: PUBLIZIERT. Aufrufstatistiken werden laufend erfasst (inserat_views, inserat_anfragen)' },
        { n:2, main:'Anfragen empfangen & Limit prüfen', desc:'Interessenten bewerben sich über standardisierten Selbstauskunft-Fragebogen (digital, keine manuelle Dokumentenerfassung). Nach jeder Bewerbung prüft Agent ob policy_max_bewerbungen erreicht ist:', branches:[
          { type:'yes', condition:'Limit noch nicht erreicht', result:'Bewerbung wird angenommen und in Queue aufgenommen' },
          { type:'no',  condition:'Limit erreicht (z.B. 30 Bewerbungen)', result:'Inserat wird automatisch auf allen Kanälen depubliziert → status = BEWERBUNGEN_GESCHLOSSEN; neue Anfragen erhalten automatische Rückmeldung' },
        ]},
        { n:3, main:'Besichtigung', desc:'Besichtigung wird koordiniert je nach Situation:', branches:[
          { type:'yes', condition:'Wiedervermietung (Vormieter anwesend)', result:'Vormieter nimmt Besichtigungen gemäss in Kündigung definierten Timeslots selbst wahr — Agent kommuniziert Slots an Interessenten' },
          { type:'alt', condition:'Leerstand / Erstvermietung', result:'Bewirtschaftung oder Sorglosfee koordiniert Besichtigung direkt — Terminbuchung via Mieterportal' },
        ]},
      ],
    },
    {
      num:'4', title:'Phase 4: Scoring & Entscheid',
      color:'#10b981', rgb:'16,185,129',
      steps:[
        { n:1, main:'Scoring & Ranking', desc:'Agent bewertet alle Bewerbungen automatisch: Vollständigkeit der Selbstauskunft, Einkommensverhältnis (Miete max. 1/3 Nettolohn), Haushaltsgrösse vs. Wohnungsgrösse, Anzahl Personen, Haustierhaltung (gemäss Policy). Bewerbungen werden gerankt.' },
        { n:2, main:'Entscheid', desc:'Mieterauswahl nach Owner-Policy:', branches:[
          { type:'yes', condition:'Auto-Entscheid (Standard)', result:'Agent wählt Kandidat mit höchstem Scoring automatisch → direkt zu Phase 5' },
          { type:'alt', condition:'Eigentümer-Entscheid (policy_eigentümer_entscheid = true)', result:'Agent stellt Top-3 Kandidaten mit Scoring-Details via Eigentümerportal zu — Eigentümer wählt innerhalb policy_owner_response_days' },
        ]},
      ],
    },
    {
      num:'5', title:'Phase 5: Verifikation',
      color:'#f59e0b', rgb:'245,158,11',
      steps:[
        { n:1, main:'Bonitätsabfrage', desc:'Agent löst automatisch CRIF-Abfrage aus: Betreibungsregisterauszug, FICO-Score — Ergebnis innerhalb Minuten' },
        { n:2, main:'Einkommensverifikation', desc:'Lohnausweis oder Steuerausweis — Upload via Bewerbungsportal; Agent prüft Vollständigkeit und Plausibilität (Einkommensverhältnis)' },
        { n:3, main:'Verifikationsergebnis', desc:'Alle Prüfungen abgeschlossen:', branches:[
          { type:'yes', condition:'Alle Prüfungen bestanden', result:'Weiter zu Phase 6 — Zusage' },
          { type:'no',  condition:'Kritische Abweichung (Betreibungen, Einkommensverhältnis)', result:'Bewerbung wird auf "reserviert" zurückgesetzt → nächster Kandidat aus Ranking wird aktiviert' },
        ]},
      ],
    },
    {
      num:'6', title:'Phase 6: Zusage & Abschluss',
      color:'#10b981', rgb:'16,185,129',
      steps:[
        { n:1, main:'Zusage kommunizieren', desc:'Bewirtschaftung sendet Zusage an ausgewählten Mieter (Portal + E-Mail) — mit voraussichtlichem Mietbeginn und nächsten Schritten (Mietvertrag & Einzug)' },
        { n:2, main:'Folge-Prozess auslösen', desc:'Mietvertrag & Einzug wird gestartet — ausgewählte Mieterdaten, Liegenschaft, Mietbeginn und inserat_id werden übergeben' },
        { n:3, main:'Absagen senden', desc:'Alle übrigen Kandidaten erhalten nach Vertragsunterzeichnung (Skribble) automatisiert eine Absage via E-Mail — Absagen werden bewusst zurückgehalten bis Vertrag rechtskräftig unterzeichnet ist (policy_absage_nach_unterzeichnung)' },

  attributes:[
    {

        { attr:'inserat_id',          type:'String/UUID', req:true,  desc:'Eindeutige Prozess-ID' },

        { attr:'wohnung_id',          type:'String/UUID', req:true,  desc:'Spezifische Wohnungseinheit' },

        { attr:'status',              type:'Enum',        req:true,  desc:'VORBEREITUNG | PUBLIZIERT | BESICHTIGUNG | ENTSCHEID | VERIFIKATION | ZUSAGE | ABGESCHLOSSEN | STORNIERT' },
        { attr:'created_at',          type:'DateTime',    req:true,  desc:'Zeitpunkt der Prozesseröffnung' },

    },
    {
      n:2, section:'Inserat & Publikation', sectionEn:'Listing & Publication',
      color:'#4a8fff', rgb:'74,143,255',
      fields:[
        { attr:'mietpreis_chf',           type:'Decimal',  req:true,  desc:'Monatliche Nettomiete in CHF' },
        { attr:'nebenkosten_chf',         type:'Decimal',  req:true,  desc:'Monatliche Nebenkosten in CHF (akonto)' },
        { attr:'verfuegbar_ab',           type:'Date',     req:true,  desc:'Frühestmögliches Einzugsdatum' },
        { attr:'inserat_text',            type:'String',   req:true,  desc:'Inseratstext (generiert durch Agent aus Knowledge Graph)' },
        { attr:'flatfox_id',              type:'String',   req:false, desc:'Externe ID des publizierten Inserats auf Flatfox/SMG' },
        { attr:'publiziert_at',           type:'DateTime', req:false, desc:'Zeitpunkt der Erstpublikation' },
        { attr:'inserat_views',           type:'Integer',  req:false, desc:'Kumulierte Aufrufe auf allen Portalen' },
        { attr:'inserat_anfragen',        type:'Integer',  req:false, desc:'Anzahl eingegangener Anfragen' },
        { attr:'freigabe_at',             type:'DateTime', req:false, desc:'Zeitpunkt der Bewirtschaftungs-Freigabe' },

      fields:[
        { attr:'bewerbungen_total',         type:'Integer',  req:false, desc:'Anzahl eingegangener Bewerbungen' },
        { attr:'scoring_run_at',            type:'DateTime', req:false, desc:'Zeitpunkt der letzten Scoring-Berechnung durch Agent' },
        { attr:'top_kandidat_id',           type:'String',   req:false, desc:'Mieter-ID des führenden Kandidaten (nach Scoring)' },
        { attr:'top3_kandidaten',           type:'JSON',     req:false, desc:'Array der Top-3 Kandidaten mit je: mieter_id, score, einkommensverhältnis, haushalt — befüllt bei policy_eigentümer_entscheid = true' },
        { attr:'gewaelter_mieter_id',       type:'String',   req:false, desc:'ID des ausgewählten Mieters — nach Auto- oder Eigentümer-Entscheid' },
        { attr:'entscheid_channel',         type:'Enum',     req:false, desc:'AUTO | EIGENTUEMER' },
        { attr:'eigentümer_entscheid_at',   type:'DateTime', req:false, desc:'Zeitpunkt des Eigentümer-Entscheids — Pflichtfeld wenn entscheid_channel = EIGENTUEMER' },
      ],

    {
      n:4, section:'Verifikation', sectionEn:'Verification',
      color:'#a855f7', rgb:'168,85,247',
      fields:[
        { attr:'crif_status',             type:'Enum',     req:false, desc:'PENDING | BESTANDEN | ABGELEHNT | MANUELL_PRUEFEN' },
        { attr:'crif_score',              type:'Integer',  req:false, desc:'FICO-Score aus CRIF-Abfrage' },
        { attr:'betreibungen_anzahl',     type:'Integer',  req:false, desc:'Anzahl offener Betreibungen aus Betreibungsregister' },
        { attr:'einkommensverif_status',  type:'Enum',     req:false, desc:'PENDING | BESTANDEN | ABGELEHNT' },
        { attr:'einkommensverhaeltnis',   type:'Decimal',  req:false, desc:'Miete als Anteil des Nettolohns (0.0–1.0); max. 0.33 empfohlen' },
        { attr:'verifikation_abgeschlossen_at', type:'DateTime', req:false, desc:'Zeitpunkt des Abschlusses aller Verifikationen' },

    {
      n:5, section:'Abschluss & Policies', sectionEn:'Closure & Policies',
      color:'#10b981', rgb:'16,185,129',

        { attr:'mietvertrag_ref_id',              type:'String',   req:false, desc:'Referenz auf gestarteten Prozess Mietvertrag & Einzug' },
        { attr:'absagen_gesendet_at',             type:'DateTime', req:false, desc:'Zeitpunkt der Absagen-Versendung (nach Vertragsunterzeichnung)' },
        { attr:'depubliziert_at',                 type:'DateTime', req:false, desc:'Zeitpunkt der Depublikation auf allen Kanälen' },
        { attr:'policy_eigentümer_entscheid',     type:'Boolean',  req:true,  desc:'true = Eigentümer wählt aus Top-3; false = Auto-Entscheid (Standard)' },
        { attr:'policy_max_bewerbungen',           type:'Integer',  req:true,  desc:'Maximale Anzahl Bewerbungen bevor Inserat automatisch depubliziert wird (Owner-Policy; z.B. 30)' },
        { attr:'policy_owner_response_days',      type:'Integer',  req:true,  desc:'SLA: Tage bis erwarteter Eigentümer-Entscheid (nur relevant wenn policy_eigentümer_entscheid = true)' },
        { attr:'policy_absage_nach_unterzeichnung', type:'Boolean', req:true, desc:'true = Absagen erst nach Vertragsunterzeichnung senden (Standard)' },

  enums:[
    { name:'Trigger Type',       values:['KUENDIGUNG','LEERSTAND','ERSTVERMIETUNG'] },

    { name:'CRIF Status',        values:['PENDING','BESTANDEN','ABGELEHNT','MANUELL_PRUEFEN'] },
    { name:'Einkommensverif.',   values:['PENDING','BESTANDEN','ABGELEHNT'] },

    { name:'Entscheid Channel',  values:['AUTO','EIGENTUEMER'] },
  ],

  validations:[
    { attr:'kuendigung_ref_id',               rule:'Pflichtfeld wenn trigger_type = KUENDIGUNG; muss auf gültige Kündigungsprozess-ID verweisen' },
    { attr:'mietpreis_chf',                   rule:'Muss vor Publikation gesetzt sein; Agent-Vorschlag aus Marktdatenabgleich, finale Freigabe durch Bewirtschaftung' },
    { attr:'inserat_text',                    rule:'Muss vor Freigabe vollständig sein — Agent generiert, Bewirtschaftung gibt frei' },
    { attr:'flatfox_id',                      rule:'Pflichtfeld wenn status = PUBLIZIERT oder höher; wird durch Agent nach Publikation gesetzt' },
    { attr:'gewaelter_mieter_id',             rule:'Pflichtfeld wenn status = ZUSAGE oder ABGESCHLOSSEN; muss auf vorhandene Bewerbung verweisen' },
    { attr:'eigentümer_entscheid_at',         rule:'Pflichtfeld wenn entscheid_channel = EIGENTUEMER; muss innerhalb policy_owner_response_days liegen' },
    { attr:'einkommensverhaeltnis',           rule:'Muss <= policy_min_einkommensverhaeltnis sein; Abweichung löst CRIF-Status MANUELL_PRUEFEN aus' },

    { attr:'policy_max_bewerbungen',          rule:'Sobald inserat_anfragen >= policy_max_bewerbungen: Inserat wird auf allen Kanälen automatisch depubliziert → status = BEWERBUNGEN_GESCHLOSSEN' },
    { attr:'absagen_gesendet_at',             rule:'Nur setzen nach Vertragsunterzeichnung (Callback aus Mietvertrag & Einzug) wenn policy_absage_nach_unterzeichnung = true' },
    { attr:'mietvertrag_ref_id',              rule:'Pflichtfeld wenn status = ABGESCHLOSSEN; muss auf gestarteten Mietvertrag & Einzug Prozess verweisen' },

const P = PROCESS_DATA;
const STATUS_LABEL = { doc:'Dokumentiert', dev:'In Entwicklung', plan:'Geplant' };
const STATUS_CLS   = { doc:'sb-doc', dev:'sb-dev', plan:'sb-plan' };

function renderHero() {
  document.title = `${P.name} · REC Space Model`;
  document.getElementById('bc-cat').textContent  = P.category;
  document.getElementById('bc-name').textContent = P.name;
  document.getElementById('topbar-version').textContent = `v${P.version}`;
  const tag = document.getElementById('hero-tag');
  tag.innerHTML = `<span class="hd-dot"></span>${P.category}`;
  tag.style.color      = P.categoryColor;
  tag.style.background = `rgba(${P.categoryRgb},.10)`;
  tag.style.border     = `1px solid rgba(${P.categoryRgb},.22)`;
  document.getElementById('hero-title').textContent = P.name;
  document.getElementById('hero-desc').textContent  = P.overview;
  document.getElementById('hero-badges').innerHTML = `
    ${P.mvp ? '<span class="sb sb-mvp">MVP</span>' : ''}
    <span class="sb ${STATUS_CLS[P.status]}">${STATUS_LABEL[P.status]}</span>`;
  document.getElementById('hero-meta').innerHTML = `
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      <span style="color:var(--color-cyan);font-weight:700">${P.automation} %</span> automatisiert
    </span>
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      ${P.actors.length} Akteure
    </span>`;
}

function renderDiagram() {
  const container = document.getElementById('svg-container');
  if (P.diagramInline) { container.innerHTML = P.diagramInline; }
  else if (P.diagramSrc) {
    container.innerHTML = `<img src="${P.diagramSrc}" alt="BPMN Prozessdiagramm" style="width:100%;height:100%;object-fit:contain;padding:20px">`;
  }
}

function renderBranches(branches) {
  return `<div class="step-branches">${branches.map(b => `
    <div class="branch">
      <div class="branch-dot branch-${b.type}"></div>
      <div class="branch-text"><span class="branch-condition">${b.condition}:</span> ${b.result}</div>
    </div>`).join('')}</div>`;
}

function renderDoku() {
  document.getElementById('doc-overview').textContent = P.overview;
  document.getElementById('doc-actors').innerHTML = P.actors.map(a => `
    <div class="actor-card" style="--ac:${a.color}">
      <div class="actor-name">${a.name}</div>
      <div class="actor-role">${a.role}</div>
      <div class="actor-resp">${a.responsibilities}</div>
    </div>`).join('');

  const flatfoxHtml = `
    <div class="section-title">Plattform-Integrationen</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px">
      ${P.flatfox.map(k => `
      <div style="background:rgba(10,15,30,.5);border:1px solid rgba(${k.rgb},.2);border-radius:10px;padding:14px;position:relative;overflow:hidden">
        <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${k.color}"></div>
        <div style="font-size:12px;font-weight:700;color:#f1f5f9;margin-bottom:6px">${k.icon} ${k.name}</div>
        <div style="font-size:11px;color:#64748b;line-height:1.5">${k.desc}</div>
      </div>`).join('')}
    </div>`;

  document.getElementById('doc-phases').insertAdjacentHTML('beforebegin', flatfoxHtml);

  document.getElementById('doc-phases').innerHTML = P.phases.map(ph => `
    <div class="phase-card">
      <div class="phase-header" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">
        <div class="phase-num" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">${ph.num}</div>
        <div class="phase-title">${ph.title}</div>
      </div>
      <div class="phase-body">
        <ul class="step-list">
          ${ph.steps.map(s => `
          <li class="step-item">
            <div class="step-n">${s.n}</div>
            <div>
              <span class="step-main">${s.main}</span>
              ${s.desc ? ` — ${s.desc}` : ''}
              ${s.branches ? renderBranches(s.branches) : ''}
            </div>
          </li>`).join('')}
        </ul>
      </div>
    </div>`).join('');
}

function renderAttr() {
  document.getElementById('attr-sections').innerHTML = P.attributes.map(sec => `
    <div class="attr-section">
      <div class="attr-section-header">
        <div class="attr-section-num" style="--asc:${sec.color};--asc-rgb:${sec.rgb}">${sec.n}</div>
        <div>
          <div class="attr-section-title">${sec.section}</div>
          <div class="attr-section-sub">${sec.sectionEn}</div>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>Attribut</th><th>Typ</th><th>Pflicht</th><th>Beschreibung</th>
        </tr></thead>
        <tbody>
          ${sec.fields.map(f => `
          <tr>
            <td class="td-attr">${f.attr}</td>
            <td class="td-type">${f.type}</td>
            <td>${f.req ? '<span class="req-yes">JA</span>' : '<span class="req-no">—</span>'}</td>
            <td>${f.desc}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');

  document.getElementById('attr-enums').innerHTML = P.enums.map(e => `
    <div class="enum-section">
      <div class="enum-title">${e.name}</div>
      <div class="enum-block">${e.values.map(v => `<span class="enum-val">${v}</span>`).join(' ')}</div>
    </div>`).join('');

  document.getElementById('attr-validations').innerHTML = `
    <table>
      <thead><tr><th>Attribut</th><th>Validierungsregel</th></tr></thead>
      <tbody>
        ${P.validations.map(v => `
        <tr>
          <td class="td-attr">${v.attr}</td>
          <td>${v.rule}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

renderHero();
renderDiagram();
renderDoku();
renderAttr();
lucide.createIcons();
</script>
</body>
</html>
