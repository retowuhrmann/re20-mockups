<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozess · REC Space Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg-base:#060b1a;--bg-radial-center:#0a1128;--bg-radial-edge:#03060f;--color-vision:#08ccab;--color-gold:#f59e0b;--color-cyan:#0ea5e9}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;background:var(--bg-base);background-image:radial-gradient(circle at 50% 20%,var(--bg-radial-center) 0%,var(--bg-radial-edge) 100%);min-height:100vh}
h1,h2,h3,h4{color:#f8fafc;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.text-gradient{background:linear-gradient(130deg,#10b981 20%,#f59e0b 55%,#4a8fff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.glow{text-shadow:0 0 30px rgba(255,255,255,.25)}
.code-badge{background:rgba(99,156,255,.10);border:1px solid rgba(99,156,255,.20);color:#93c5fd;padding:.18rem .65rem;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:.78rem;display:inline-block}
#topbar{padding:18px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.back-link{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#64748b;text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--color-vision)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace}
.breadcrumb span{color:#475569}
.bc-active{color:var(--color-vision) !important}
#hero{padding:32px 56px 24px;border-bottom:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:300px;background:radial-gradient(ellipse,rgba(16,185,129,.06) 0%,transparent 60%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);background:rgba(8,204,171,.10);padding:4px 12px;border-radius:9999px;border:1px solid rgba(8,204,171,.22);font-family:'JetBrains Mono',monospace}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--color-vision);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sb{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 10px;border-radius:9999px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.sb-doc{background:rgba(8,204,171,.15);color:#08ccab;border:1px solid rgba(8,204,171,.3)}
.sb-dev{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.sb-plan{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.08)}
.sb-mvp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.35)}
#tab-nav{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.5);backdrop-filter:blur(10px);padding:0 56px;position:sticky;top:60px;z-index:90}
.tab-btn{padding:14px 24px;font-size:13px;font-weight:600;color:#475569;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:'Segoe UI',sans-serif}
.tab-btn:hover{color:#94a3b8}
.tab-btn.active{color:var(--color-vision);border-bottom-color:var(--color-vision)}
.tab-btn i{width:15px;height:15px}
.tab-panel{display:none;padding:40px 56px 80px}
.tab-panel.active{display:block}
#svg-wrapper{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(8,204,171,.08), 0 24px 64px rgba(0,0,0,.6)}
#svg-container{width:100%;min-height:560px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#svg-placeholder{text-align:center;padding:60px 40px}
.svg-hint{font-family:'JetBrains Mono',monospace;font-size:12px;color:#334155;margin-top:20px;line-height:2;text-align:left;display:inline-block}
.svg-hint span{color:var(--color-vision)}
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.prose{font-size:13px;color:#94a3b8;line-height:1.8;margin-bottom:28px}
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px}
.actor-card{background:rgba(10,15,30,.65);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.actor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.actor-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:2px}
.actor-role{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.actor-resp{font-size:11px;color:#64748b;line-height:1.6}
.phases-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:32px}
.phase-card{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.phase-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02)}
.phase-num{min-width:32px;height:26px;padding:0 8px;border-radius:6px;background:rgba(var(--pc-rgb),.2);border:1px solid rgba(var(--pc-rgb),.4);color:var(--pc);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.phase-title{font-size:13px;font-weight:700;color:#f1f5f9}
.phase-body{padding:16px 20px}
.step-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#94a3b8;line-height:1.6}
.step-n{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#475569;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-family:'JetBrains Mono',monospace}
.step-main{font-weight:600;color:#cbd5e1}
.step-branches{margin-top:6px;padding-left:4px;display:flex;flex-direction:column;gap:4px}
.branch{font-size:11px;display:flex;gap:6px;align-items:flex-start}
.branch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.branch-yes{background:#10b981}
.branch-no{background:#f43f5e}
.branch-alt{background:#f59e0b}
.branch-text{color:#64748b}
.branch-condition{font-weight:600;color:#94a3b8}
.attr-section{margin-bottom:32px}
.attr-section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attr-section-num{width:24px;height:24px;border-radius:6px;background:rgba(var(--asc-rgb),.2);border:1px solid rgba(var(--asc-rgb),.35);color:var(--asc);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.attr-section-title{font-size:13px;font-weight:700;color:#f1f5f9}
.attr-section-sub{font-size:10px;color:#475569;font-family:'JetBrains Mono',monospace}
table{width:100%;border-collapse:collapse;background:rgba(10,15,30,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
thead th{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#475569;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-family:'JetBrains Mono',monospace}
tbody td{padding:9px 14px;font-size:12px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.td-attr{font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd}
.td-type{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b}
.req-yes{color:#10b981;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.req-no{color:#334155;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.enum-section{margin-bottom:28px}
.enum-title{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px}
.enum-block{background:rgba(10,15,30,.7);border:1px solid rgba(99,156,255,.15);border-radius:8px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd;line-height:2}
.enum-val{display:inline-block;background:rgba(99,156,255,.08);border:1px solid rgba(99,156,255,.15);border-radius:4px;padding:1px 7px;margin:2px 3px;color:#93c5fd}
.val-table table{margin-top:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
</style>
</head>
<body>

<div id="topbar">
  <div class="breadcrumb">
    <a href="prozesslandkarte.html" class="back-link">
      <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
      Prozesslandkarte
    </a>
    <span style="color:#1e293b">/</span>
    <span id="bc-cat"></span>
    <span style="color:#1e293b">/</span>
    <span id="bc-name" class="bc-active"></span>
  </div>
  <div class="code-badge" id="topbar-version"></div>
</div>

<div id="hero">
  <div id="hero-tag" class="hero-tag"><span class="hd-dot"></span></div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:4px">
    <div>
      <h1 id="hero-title" class="text-3xl font-bold text-gradient glow" style="margin-bottom:8px"></h1>
      <p id="hero-desc" class="text-sm" style="color:#64748b;max-width:680px;line-height:1.7"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:7px;align-items:center" id="hero-badges"></div>
      <div style="display:flex;gap:16px;align-items:center" id="hero-meta"></div>
    </div>
  </div>
</div>

<nav id="tab-nav">
  <button class="tab-btn active" onclick="showTab('prozess',this)">
    <i data-lucide="git-branch"></i> Prozess
  </button>
  <button class="tab-btn" onclick="showTab('doku',this)">
    <i data-lucide="file-text"></i> Dokumentation
  </button>
  <button class="tab-btn" onclick="showTab('attr',this)">
    <i data-lucide="database"></i> Attributkatalog
  </button>
</nav>

<div class="tab-panel active" id="tab-prozess">
  <div id="svg-wrapper">
  <div id="svg-container">
    <div id="svg-placeholder">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <i data-lucide="git-fork" style="width:28px;height:28px;color:#334155"></i>
      </div>
      <p style="font-size:14px;font-weight:700;color:#475569;margin-bottom:6px">BPMN-Diagramm</p>
      <p style="font-size:12px;color:#334155;margin-bottom:20px">SVG-Export hier einfügen</p>
      <div class="svg-hint">diagramSrc: <span>'bpmn_Investitionsentscheid.svg'</span></div>
    </div>
  </div>
  </div>
</div>

<div class="tab-panel" id="tab-doku">
  <div style="max-width:900px">
    <div class="section-title">Prozessübersicht</div>
    <p class="prose" id="doc-overview"></p>
    <div class="section-title">Beteiligte Akteure</div>
    <div class="actor-grid" id="doc-actors"></div>
    <div class="section-title">Prozessablauf</div>
    <div class="phases-grid" id="doc-phases"></div>
  </div>
</div>

<div class="tab-panel" id="tab-attr">
  <div style="max-width:1100px">
    <div id="attr-sections"></div>
    <div class="section-title" style="margin-top:40px">Enum-Definitionen</div>
    <div id="attr-enums"></div>
    <div class="section-title" style="margin-top:32px">Validierungsregeln</div>
    <div class="val-table" id="attr-validations"></div>
  </div>
</div>

<script>
const PROCESS_DATA = {

  name:          'Investitionsentscheid',
  nameEn:        'Investment Decision',
  category:      'Eigentümer-Prozess',
  categoryColor: '#10b981',
  categoryRgb:   '16,185,129',
  status:        'doc',
  mvp:           true,
  automation:    45,
  version:       '1.0',
  backLink:      'prozesslandkarte.html',

  diagramSrc:    'bpmn_Investitionsentscheid.svg',
  diagramInline: null,

  overview: 'Der Investitionsentscheid wird ausgelöst durch einen Schaden mit Investitionsbedarf (Sub-Prozess Schaden melden), durch den Eigentümer direkt oder durch Bewirtschaftung. Bewirtschaftung erstellt einen Leistungsbeschrieb und holt bei drei Anbietern Offerten ein. Agent Swarms vergleichen die eingegangenen Offerten systematisch (Preis, Ausführungszeit, Garantie, Anbieterbewertung) und leiten eine datenbasierte Empfehlung ab. Das vollständige Vergleichsdossier wird dem Eigentümer direkt via Portal zugestellt — er wählt eine Offerte und genehmigt. Nach Genehmigung wird der ausgewählte Anbieter beauftragt und der Auslöser-Prozess abgeschlossen.',

  actors: [
    { name:'Eigentümer',      role:'Trigger & Entscheidungsträger', color:'#10b981', rgb:'16,185,129', responsibilities:'Kann Investitionsbedarf direkt melden, Vergleichsdossier im Portal prüfen, Offerte wählen und genehmigen — alternativ persönlich mit digitaler Bestätigung' },
    { name:'Bewirtschaftung', role:'Leistungsbeschrieb & Ausschreibung', color:'#0ea5e9', rgb:'14,165,233', responsibilities:'Investitionsbedarf melden, Leistungsbeschrieb erstellen, drei Anbieter aus Pool selektieren und anfragen, Offerten entgegennehmen, Revision koordinieren' },
    { name:'Agent Swarms',    role:'Offerten-Vergleich & Empfehlung', color:'#4a8fff', rgb:'74,143,255', responsibilities:'Eingegangene Offerten strukturieren und systematisch vergleichen, Empfehlung mit Begründung ableiten, Beauftragung und Benachrichtigungen auslösen' },
    { name:'Anbieter',        role:'Offertsteller',                  color:'#f59e0b', rgb:'245,158,11', responsibilities:'Offerte auf Basis Leistungsbeschrieb einreichen (Preis, Ausführungszeit, Garantie) — drei Anbieter pro Vorhaben' },
  ],

  vergleich: [
    { name:'Preis',               icon:'💰', color:'#f43f5e', rgb:'244,63,94',  desc:'Angebotspreis in CHF inkl. MwSt. — absolut und pro Lebensdauerjahr',         gewichtung:'Hoch' },
    { name:'Ausführungszeit',     icon:'⏱️', color:'#f59e0b', rgb:'245,158,11', desc:'Erwartete Dauer der Massnahme in Wochen',                                      gewichtung:'Mittel' },
    { name:'Garantie',            icon:'🛡️', color:'#4a8fff', rgb:'74,143,255', desc:'Garantiedauer auf Material und Arbeit in Jahren',                               gewichtung:'Mittel' },
    { name:'Anbieterbewertung',   icon:'⭐', color:'#08ccab', rgb:'8,204,171',  desc:'Historische Bewertung aus früheren Aufträgen (falls in BOS vorhanden)',          gewichtung:'Mittel' },
    { name:'Compliance',          icon:'✅', color:'#10b981', rgb:'16,185,129', desc:'Vollständige Erfüllung des Leistungsbeschriebs und regulatorischer Anforderungen', gewichtung:'Pflicht' },
  ],

  phases: [
    {
      num:'1', title:'Phase 1: Auslösung',
      color:'#0ea5e9', rgb:'14,165,233',
      steps:[
        { n:1, main:'Trigger', desc:'Drei mögliche Eintrittspunkte:', branches:[
          { type:'yes', condition:'Schaden melden (Sub-Prozess)', result:'Schaden überschreitet policy_investment_threshold oder erfordert strukturellen Eingriff → Investitionsentscheid wird als Offering aus dem Schadensprozess übergeben (trigger_ref_id)' },
          { type:'alt', condition:'Eigentümer direkt', result:'Eigentümer meldet Investitionswunsch via Portal (z.B. Sanierung, Aufwertung) → Bewirtschaftung erhält Auftrag zur Ausschreibung' },
          { type:'alt', condition:'Bewirtschaftung direkt', result:'Bewirtschaftung identifiziert Investitionsbedarf proaktiv und eröffnet Prozess' },
        ]},
        { n:2, main:'Klassifikation', desc:'Kategorie (Dach, Heizung, Sanitär, Elektro, Fassade, Geräte) und Dringlichkeit (SOFORT / DRINGEND / MITTELFRISTIG / GEPLANT) werden festgelegt — Dringlichkeit beeinflusst Offert-Deadline' },
      ],
    },
    {
      num:'2', title:'Phase 2: Leistungsbeschrieb & Ausschreibung',
      color:'#0ea5e9', rgb:'14,165,233',
      steps:[
        { n:1, main:'Leistungsbeschrieb erstellen', desc:'Bewirtschaftung definiert Scope, technische Anforderungen, Qualitätsstandards und Rahmenbedingungen (Zugang, Mieterkoordination) — Grundlage für alle drei Offerten' },
        { n:2, main:'Anbieter selektieren', desc:'Agent wählt drei qualifizierte Anbieter aus dem BOS-Provider-Pool — basierend auf Kategorie, Region, Verfügbarkeit und historischer Bewertung' },
        { n:3, main:'Review durch Bewirtschaftung', desc:'Bewirtschaftung prüft die Agent-Selektion kurz (Plausibilität, allfällige Interessenkonflikte) — kann Anbieter ersetzen' },
        { n:4, main:'Offertanfrage senden', desc:'Agent sendet Leistungsbeschrieb an alle drei Anbieter via Portal + E-Mail mit Offert-Deadline (policy_offert_deadline_days)' },
      ],
    },
    {
      num:'3', title:'Phase 3: Offerteinholung',
      color:'#f59e0b', rgb:'245,158,11',
      steps:[
        { n:1, main:'Offerten entgegennehmen', desc:'Anbieter reichen Offerten ein (Preis, Ausführungszeit, Garantie, allfällige Bemerkungen) — direkt via Portal oder per E-Mail erfasst durch Bewirtschaftung' },
        { n:2, main:'Vollständigkeit prüfen', desc:'Agent prüft ob alle drei Offerten eingegangen und vollständig sind', branches:[
          { type:'yes', condition:'Alle drei Offerten vollständig', result:'Weiter zu Phase 4' },
          { type:'alt', condition:'Offerte fehlt oder unvollständig', result:'Agent sendet Erinnerung an Anbieter; nach policy_offert_deadline_days → Bewirtschaftung entscheidet ob Ersatzanbieter oder Ausnahme mit zwei Offerten' },

      ],
    },
    {
      num:'4', title:'Phase 4: Offerten-Vergleich',
      color:'#4a8fff', rgb:'74,143,255',
      steps:[
        { n:1, main:'Strukturierter Vergleich', desc:'Agent vergleicht alle Offerten systematisch: Preis absolut und pro Lebensdauerjahr, Ausführungszeit, Garantie, Anbieterbewertung aus BOS-Historie, Compliance mit Leistungsbeschrieb' },
        { n:2, main:'Empfehlung ableiten', desc:'Agent wählt empfohlene Offerte basierend auf Gesamtbewertung (gewichtete Kriterien), Dringlichkeit und policy_investment_threshold; Empfehlung wird mit Begründung ausgewiesen' },
        { n:3, main:'Vergleichsdossier erstellen', desc:'Übersichtliche Gegenüberstellung aller drei Offerten mit Bewertungsmatrix, hervorgehobener Empfehlung und Leistungsbeschrieb als Beilage' },
      ],
    },
    {
      num:'5', title:'Phase 5: Entscheid',
      color:'#f59e0b', rgb:'245,158,11',
      steps:[
        { n:1, main:'Dossier zustellen', desc:'Bewirtschaftung prüft Vergleichsdossier kurz und reicht an Eigentümer ein (Portal + E-Mail-Notification); SLA: policy_owner_response_days' },
        { n:2, main:'Offerte wählen', desc:'Eigentümer sichtet alle drei Offerten mit Vergleichsmatrix und Empfehlung im Portal', branches:[
          { type:'yes', condition:'Genehmigt (Offerte 1/2/3)', result:'Gewählte Offerte festgehalten → weiter zu Phase 6' },
          { type:'alt', condition:'Rückfrage / neue Offerte gewünscht', result:'Bewirtschaftung klärt oder holt Ersatzofferte ein → version++ → erneute Einreichung; max. policy_max_revisions' },
          { type:'no',  condition:'Abgelehnt', result:'Investition zurückgestellt; trigger_ref_id-Prozess erhält Rückmeldung' },
        ]},
      ],
    },
    {
      num:'6', title:'Phase 6: Beauftragung',
      color:'#10b981', rgb:'16,185,129',
      steps:[
        { n:1, main:'Anbieter beauftragen', desc:'Agent sendet Auftragsbestätigung an gewählten Anbieter (beauftragung_ref_id); abgelehnte Anbieter erhalten Absage' },
        { n:2, main:'Parteien informieren', desc:'Bewirtschaftung: Freigabe-Notification. Mieter (falls betroffen): Ankündigung der Massnahme mit voraussichtlichem Ausführungszeitraum' },
        { n:3, main:'Auslöser-Prozess abschliessen', desc:'Falls trigger_type = SCHADEN_MELDEN: Schadensprozess erhält Callback → als «Investition beauftragt» markiert' },
      ],
    },
  ],

  attributes:[
    {
      n:1, section:'Prozess-Identifikation', sectionEn:'Process Identity',
      color:'#10b981', rgb:'16,185,129',
      fields:[
        { attr:'investition_id',   type:'String/UUID', req:true,  desc:'Eindeutige Prozess-ID' },
        { attr:'owner_id',         type:'String/UUID', req:true,  desc:'Eigentümer-ID aus dem BOS' },
        { attr:'liegenschaft_id',  type:'String/UUID', req:true,  desc:'Betroffene Liegenschaft' },
        { attr:'trigger_type',     type:'Enum',        req:true,  desc:'SCHADEN_MELDEN | EIGENTUEMER | BEWIRTSCHAFTUNG' },
        { attr:'trigger_ref_id',   type:'String/UUID', req:false, desc:'Referenz auf auslösenden Schadensprozess — Pflichtfeld wenn trigger_type = SCHADEN_MELDEN' },
        { attr:'status',           type:'Enum',        req:true,  desc:'DRAFT | AUSSCHREIBUNG | OFFERTEN_AUSSTEHEND | VERGLEICH | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | IN_UMSETZUNG | ABGESCHLOSSEN' },
        { attr:'version',          type:'Integer',     req:true,  desc:'Iterationszähler — wird bei jeder Revision inkrementiert' },
        { attr:'created_at',       type:'DateTime',    req:true,  desc:'Zeitpunkt der Prozesseröffnung' },
      ],
    },
    {
      n:2, section:'Sachverhalt & Leistungsbeschrieb', sectionEn:'Issue & Scope',
      color:'#0ea5e9', rgb:'14,165,233',
      fields:[
        { attr:'kategorie',            type:'Enum',   req:true,  desc:'DACH | HEIZUNG | SANITAER | ELEKTRO | FASSADE | GERAETE | SONSTIGES' },
        { attr:'beschreibung',         type:'String', req:true,  desc:'Freitext-Beschreibung des Investitionsvorhabens' },
        { attr:'dringlichkeit',        type:'Enum',   req:true,  desc:'SOFORT | DRINGEND | MITTELFRISTIG | GEPLANT — beeinflusst Offert-Deadline' },
        { attr:'leistungsbeschrieb',   type:'String', req:true,  desc:'Detaillierter Scope, technische Anforderungen und Rahmenbedingungen — Grundlage für alle Anbieter' },
        { attr:'leistungsbeschrieb_at',type:'DateTime',req:true, desc:'Zeitpunkt der Fertigstellung des Leistungsbeschriebs durch Bewirtschaftung' },
      ],
    },
    {
      n:3, section:'Ausschreibung & Offerten', sectionEn:'Tender & Offers',
      color:'#f59e0b', rgb:'245,158,11',
      fields:[
        { attr:'offert_deadline_at',         type:'DateTime',    req:true,  desc:'Frist für Offerteinreichung (berechnet aus dringlichkeit + policy_offert_deadline_days)' },
        { attr:'anbieter_1_id',              type:'String/UUID', req:true,  desc:'Anbieter 1 aus BOS-Provider-Pool' },
        { attr:'anbieter_1_preis_chf',       type:'Decimal',     req:false, desc:'Angebotspreis Anbieter 1 in CHF inkl. MwSt.' },
        { attr:'anbieter_1_ausfuehrung_wo',  type:'Integer',     req:false, desc:'Ausführungszeit Anbieter 1 in Wochen' },
        { attr:'anbieter_1_garantie_jahre',  type:'Integer',     req:false, desc:'Garantiedauer Anbieter 1 in Jahren' },
        { attr:'anbieter_1_eingegangen_at',  type:'DateTime',    req:false, desc:'Zeitpunkt des Offerteingangs Anbieter 1' },
        { attr:'anbieter_2_id',              type:'String/UUID', req:true,  desc:'Anbieter 2 aus BOS-Provider-Pool' },
        { attr:'anbieter_2_preis_chf',       type:'Decimal',     req:false, desc:'Angebotspreis Anbieter 2 in CHF inkl. MwSt.' },
        { attr:'anbieter_2_ausfuehrung_wo',  type:'Integer',     req:false, desc:'Ausführungszeit Anbieter 2 in Wochen' },
        { attr:'anbieter_2_garantie_jahre',  type:'Integer',     req:false, desc:'Garantiedauer Anbieter 2 in Jahren' },
        { attr:'anbieter_2_eingegangen_at',  type:'DateTime',    req:false, desc:'Zeitpunkt des Offerteingangs Anbieter 2' },
        { attr:'anbieter_3_id',              type:'String/UUID', req:true,  desc:'Anbieter 3 aus BOS-Provider-Pool' },
        { attr:'anbieter_3_preis_chf',       type:'Decimal',     req:false, desc:'Angebotspreis Anbieter 3 in CHF inkl. MwSt.' },
        { attr:'anbieter_3_ausfuehrung_wo',  type:'Integer',     req:false, desc:'Ausführungszeit Anbieter 3 in Wochen' },
        { attr:'anbieter_3_garantie_jahre',  type:'Integer',     req:false, desc:'Garantiedauer Anbieter 3 in Jahren' },
        { attr:'anbieter_3_eingegangen_at',  type:'DateTime',    req:false, desc:'Zeitpunkt des Offerteingangs Anbieter 3' },
      ],
    },
    {
      n:4, section:'Offerten-Vergleich', sectionEn:'Offer Comparison',
      color:'#4a8fff', rgb:'74,143,255',
      fields:[
        { attr:'empfehlung_anbieter',      type:'Integer',  req:true,  desc:'Empfohlener Anbieter: 1, 2 oder 3' },
        { attr:'empfehlung_begruendung',   type:'String',   req:true,  desc:'Begründung der Empfehlung (Kriterien-Gewichtung, Stärken/Schwächen je Anbieter)' },
        { attr:'vergleich_erstellt_at',    type:'DateTime', req:true,  desc:'Zeitpunkt der Vergleichsdossier-Erstellung durch Agent' },
      ],
    },
    {
      n:5, section:'Entscheid & Beauftragung', sectionEn:'Decision & Award',
      color:'#a855f7', rgb:'168,85,247',
      fields:[
        { attr:'submitted_at',                type:'DateTime', req:false, desc:'Zeitpunkt der Einreichung an Eigentümer' },
        { attr:'gewaelter_anbieter',          type:'Integer',  req:false, desc:'Vom Eigentümer gewählter Anbieter: 1, 2 oder 3 — Pflichtfeld wenn status = APPROVED' },
        { attr:'approval_channel',            type:'Enum',     req:false, desc:'PORTAL | PERSOENLICH' },
        { attr:'decision',                    type:'Enum',     req:false, desc:'APPROVED | REVISION_REQUESTED | REJECTED' },
        { attr:'decision_at',                 type:'DateTime', req:false, desc:'Zeitpunkt des Eigentümer-Entscheids' },
        { attr:'owner_comment',               type:'String',   req:false, desc:'Kommentar — Pflichtfeld bei REVISION_REQUESTED und REJECTED' },
        { attr:'policy_owner_response_days',  type:'Integer',  req:true,  desc:'SLA: Tage bis erwarteter Entscheid (Owner-Policy)' },
        { attr:'policy_offert_deadline_days', type:'Integer',  req:true,  desc:'Frist für Anbieter zur Offerteinreichung in Tagen (Owner-Policy, abhängig von Dringlichkeit)' },
        { attr:'policy_investment_threshold', type:'Decimal',  req:true,  desc:'Schwellenwert CHF ab dem Eigentümer-Genehmigung zwingend erforderlich ist (Owner-Policy)' },
        { attr:'policy_max_revisions',        type:'Integer',  req:true,  desc:'Maximale Revisionsrunden (Owner-Policy)' },
        { attr:'beauftragung_ref_id',         type:'String/UUID', req:false, desc:'Referenz auf Auftragsabwicklung — gesetzt nach Genehmigung' },
        { attr:'beauftragung_sent_at',        type:'DateTime', req:false, desc:'Zeitpunkt der Auftragsbestätigung an gewählten Anbieter' },
      ],
    },
  ],

  enums:[
    { name:'Trigger Type',  values:['SCHADEN_MELDEN','EIGENTUEMER','BEWIRTSCHAFTUNG'] },
    { name:'Status',        values:['DRAFT','AUSSCHREIBUNG','OFFERTEN_AUSSTEHEND','VERGLEICH','SUBMITTED','REVISION_REQUESTED','APPROVED','REJECTED','IN_UMSETZUNG','ABGESCHLOSSEN'] },
    { name:'Kategorie',     values:['DACH','HEIZUNG','SANITAER','ELEKTRO','FASSADE','GERAETE','SONSTIGES'] },
    { name:'Dringlichkeit', values:['SOFORT','DRINGEND','MITTELFRISTIG','GEPLANT'] },
    { name:'Decision',      values:['APPROVED','REVISION_REQUESTED','REJECTED'] },
    { name:'Approval Channel', values:['PORTAL','PERSOENLICH'] },
  ],

  validations:[
    { attr:'trigger_ref_id',              rule:'Pflichtfeld wenn trigger_type = SCHADEN_MELDEN; muss auf gültige Schadensprozess-ID verweisen' },
    { attr:'leistungsbeschrieb',          rule:'Muss vor Offertversand (status = AUSSCHREIBUNG) vollständig vorliegen — gleicher Text für alle drei Anbieter' },
    { attr:'anbieter_*_preis_chf',        rule:'Pflichtfeld für Offerten-Vergleich; alle drei Offerten müssen vorliegen bevor Agent-Vergleich gestartet wird (Ausnahme: policy-basierte Zweier-Offerte nach Deadline)' },
    { attr:'empfehlung_anbieter',         rule:'Muss 1, 2 oder 3 sein; systemseitig gesetzt, darf durch Bewirtschaftung mit Begründungsanpassung korrigiert werden' },
    { attr:'offert_deadline_at',          rule:'Muss policy_offert_deadline_days nach leistungsbeschrieb_at liegen; bei dringlichkeit = SOFORT maximal 3 Tage' },
    { attr:'gewaelter_anbieter',          rule:'Pflichtfeld wenn status = APPROVED oder IN_UMSETZUNG; muss 1, 2 oder 3 sein' },
    { attr:'owner_comment',               rule:'Pflichtfeld wenn decision = REVISION_REQUESTED oder REJECTED' },
    { attr:'approval_channel',            rule:'Pflichtfeld wenn decision = APPROVED; auch bei persönlichem Entscheid muss Genehmigung digital bestätigt werden' },
    { attr:'beauftragung_ref_id',         rule:'Pflichtfeld wenn status = IN_UMSETZUNG' },
    { attr:'version',                     rule:'Wenn version > policy_max_revisions → Eskalation; Bewirtschaftung-Leitung wird informiert' },
  ],
};

const P = PROCESS_DATA;
const STATUS_LABEL = { doc:'Dokumentiert', dev:'In Entwicklung', plan:'Geplant' };
const STATUS_CLS   = { doc:'sb-doc', dev:'sb-dev', plan:'sb-plan' };

function renderHero() {
  document.title = `${P.name} · REC Space Model`;
  document.getElementById('bc-cat').textContent  = P.category;
  document.getElementById('bc-name').textContent = P.name;
  document.getElementById('topbar-version').textContent = `v${P.version}`;
  const tag = document.getElementById('hero-tag');
  tag.innerHTML = `<span class="hd-dot"></span>${P.category}`;
  tag.style.color      = P.categoryColor;
  tag.style.background = `rgba(${P.categoryRgb},.10)`;
  tag.style.border     = `1px solid rgba(${P.categoryRgb},.22)`;
  document.getElementById('hero-title').textContent = P.name;
  document.getElementById('hero-desc').textContent  = P.overview;
  document.getElementById('hero-badges').innerHTML = `
    ${P.mvp ? '<span class="sb sb-mvp">MVP</span>' : ''}
    <span class="sb ${STATUS_CLS[P.status]}">${STATUS_LABEL[P.status]}</span>`;
  document.getElementById('hero-meta').innerHTML = `
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      <span style="color:var(--color-cyan);font-weight:700">${P.automation} %</span> automatisiert
    </span>
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      ${P.actors.length} Akteure
    </span>`;
}

function renderDiagram() {
  const container = document.getElementById('svg-container');
  if (P.diagramInline) { container.innerHTML = P.diagramInline; }
  else if (P.diagramSrc) {
    container.innerHTML = `<img src="${P.diagramSrc}" alt="BPMN Prozessdiagramm" style="width:100%;height:100%;object-fit:contain;padding:20px">`;
  }
}

function renderBranches(branches) {
  return `<div class="step-branches">${branches.map(b => `
    <div class="branch">
      <div class="branch-dot branch-${b.type}"></div>
      <div class="branch-text"><span class="branch-condition">${b.condition}:</span> ${b.result}</div>
    </div>`).join('')}</div>`;
}

function renderDoku() {
  document.getElementById('doc-overview').textContent = P.overview;
  document.getElementById('doc-actors').innerHTML = P.actors.map(a => `
    <div class="actor-card" style="--ac:${a.color}">
      <div class="actor-name">${a.name}</div>
      <div class="actor-role">${a.role}</div>
      <div class="actor-resp">${a.responsibilities}</div>
    </div>`).join('');

  const vergleichHtml = `
    <div class="section-title">Vergleichskriterien</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px">
      ${P.vergleich.map(k => `
      <div style="background:rgba(10,15,30,.5);border:1px solid rgba(${k.rgb},.2);border-radius:10px;padding:14px;position:relative;overflow:hidden">
        <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${k.color}"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;font-weight:700;color:#f1f5f9">${k.icon} ${k.name}</span>
          <span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:9999px;background:rgba(${k.rgb},.15);color:${k.color};font-family:'JetBrains Mono',monospace">${k.gewichtung}</span>
        </div>
        <div style="font-size:11px;color:#64748b;line-height:1.5">${k.desc}</div>
      </div>`).join('')}
    </div>`;

  document.getElementById('doc-phases').insertAdjacentHTML('beforebegin', vergleichHtml);

  document.getElementById('doc-phases').innerHTML = P.phases.map(ph => `
    <div class="phase-card">
      <div class="phase-header" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">
        <div class="phase-num">${ph.num}</div>
        <div class="phase-title">${ph.title}</div>
      </div>
      <div class="phase-body">
        <ul class="step-list">
          ${ph.steps.map(s => `
          <li class="step-item">
            <div class="step-n">${s.n}</div>
            <div style="flex:1">
              <span class="step-main">${s.main}</span>
              ${s.desc ? ` <span style="color:#475569">— ${s.desc}</span>` : ''}
              ${s.branches ? renderBranches(s.branches) : ''}
            </div>
          </li>`).join('')}
        </ul>
      </div>
    </div>`).join('');
}

function renderAttr() {
  document.getElementById('attr-sections').innerHTML = P.attributes.map(sec => `
    <div class="attr-section">
      <div class="attr-section-header" style="--asc:${sec.color};--asc-rgb:${sec.rgb}">
        <div class="attr-section-num">${sec.n}</div>
        <div>
          <div class="attr-section-title">${sec.section}</div>
          <div class="attr-section-sub">${sec.sectionEn}</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Attribut</th><th>Datentyp</th><th>Pflicht</th><th>Beschreibung</th></tr></thead>
        <tbody>
          ${sec.fields.map(f => `
          <tr>
            <td class="td-attr">${f.attr}</td>
            <td class="td-type">${f.type}</td>
            <td>${f.req ? '<span class="req-yes">Ja</span>' : '<span class="req-no">Nein</span>'}</td>
            <td>${f.desc}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');

  document.getElementById('attr-enums').innerHTML = P.enums.map(e => `
    <div class="enum-section">
      <div class="enum-title">${e.name}</div>
      <div class="enum-block">${e.values.map(v => `<span class="enum-val">${v}</span>`).join(' ')}</div>
    </div>`).join('');

  document.getElementById('attr-validations').innerHTML = `
    <table>
      <thead><tr><th>Attribut</th><th>Regel</th></tr></thead>
      <tbody>${P.validations.map(v => `
        <tr><td class="td-attr">${v.attr}</td><td>${v.rule}</td></tr>`).join('')}
      </tbody>
    </table>`;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

renderHero();
renderDiagram();
renderDoku();
renderAttr();
lucide.createIcons();
</script>
</body>
</html>
