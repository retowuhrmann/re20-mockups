<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozess · REC Space Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg-base:#060b1a;--bg-radial-center:#0a1128;--bg-radial-edge:#03060f;--color-vision:#08ccab;--color-gold:#f59e0b;--color-cyan:#0ea5e9}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0;background:var(--bg-base);background-image:radial-gradient(circle at 50% 20%,var(--bg-radial-center) 0%,var(--bg-radial-edge) 100%);min-height:100vh}
h1,h2,h3,h4{color:#f8fafc;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.text-gradient{background:linear-gradient(130deg,#4a8fff 20%,#a855f7 55%,#f59e0b 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.glow{text-shadow:0 0 30px rgba(255,255,255,.25)}
.code-badge{background:rgba(99,156,255,.10);border:1px solid rgba(99,156,255,.20);color:#93c5fd;padding:.18rem .65rem;border-radius:9999px;font-family:'JetBrains Mono',monospace;font-size:.78rem;display:inline-block}
.glass{background:rgba(10,15,30,.65);backdrop-filter:blur(16px);border:1px solid rgba(8,204,171,.18);border-radius:14px}

/* TOPBAR */
#topbar{padding:18px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.back-link{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#64748b;text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--color-vision)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace}
.breadcrumb span{color:#475569}
.bc-active{color:var(--color-vision) !important}

/* HERO */
#hero{padding:32px 56px 24px;border-bottom:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:300px;background:radial-gradient(ellipse,rgba(168,85,247,.06) 0%,transparent 60%);pointer-events:none}
.hero-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);background:rgba(8,204,171,.10);padding:4px 12px;border-radius:9999px;border:1px solid rgba(8,204,171,.22);font-family:'JetBrains Mono',monospace}
.hd-dot{width:6px;height:6px;border-radius:50%;background:var(--color-vision);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* STATUS BADGES */
.sb{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 10px;border-radius:9999px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.sb-doc{background:rgba(8,204,171,.15);color:#08ccab;border:1px solid rgba(8,204,171,.3)}
.sb-dev{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.sb-plan{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.08)}
.sb-mvp{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.35)}

/* TABS */
#tab-nav{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(6,11,26,.5);backdrop-filter:blur(10px);padding:0 56px;position:sticky;top:60px;z-index:90}
.tab-btn{padding:14px 24px;font-size:13px;font-weight:600;color:#475569;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:'Segoe UI',sans-serif}
.tab-btn:hover{color:#94a3b8}
.tab-btn.active{color:var(--color-vision);border-bottom-color:var(--color-vision)}
.tab-btn i{width:15px;height:15px}

/* TAB PANELS */
.tab-panel{display:none;padding:40px 56px 80px}
.tab-panel.active{display:block}

/* SVG EMBED */
#svg-wrapper{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(8,204,171,.08), 0 24px 64px rgba(0,0,0,.6)}
#svg-container{width:100%;min-height:560px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#svg-container img,#svg-container object,#svg-container embed{width:100%;height:100%;object-fit:contain;display:block}
#svg-placeholder{text-align:center;padding:60px 40px}
.svg-hint{font-family:'JetBrains Mono',monospace;font-size:12px;color:#334155;margin-top:20px;line-height:2;text-align:left;display:inline-block}
.svg-hint span{color:var(--color-vision)}

/* DOC CONTENT */
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--color-vision);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.prose{font-size:13px;color:#94a3b8;line-height:1.8;margin-bottom:28px}

/* ACTOR CARDS */
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:32px}
.actor-card{background:rgba(10,15,30,.65);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.actor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
.actor-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:2px}
.actor-role{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.actor-resp{font-size:11px;color:#64748b;line-height:1.6}

/* PHASES */
.phases-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:32px}
.phase-card{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.phase-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02)}
.phase-num{min-width:32px;height:26px;padding:0 8px;border-radius:6px;background:rgba(var(--pc-rgb),.2);border:1px solid rgba(var(--pc-rgb),.4);color:var(--pc);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.phase-title{font-size:13px;font-weight:700;color:#f1f5f9}
.phase-body{padding:16px 20px}
.step-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#94a3b8;line-height:1.6}
.step-n{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#475569;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-family:'JetBrains Mono',monospace}
.step-main{font-weight:600;color:#cbd5e1}
.step-branches{margin-top:6px;padding-left:4px;display:flex;flex-direction:column;gap:4px}
.branch{font-size:11px;display:flex;gap:6px;align-items:flex-start}
.branch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.branch-yes{background:#10b981}
.branch-no{background:#f43f5e}
.branch-alt{background:#f59e0b}
.branch-text{color:#64748b}
.branch-condition{font-weight:600;color:#94a3b8}

/* ATTRIBUTE TABLES */
.attr-section{margin-bottom:32px}
.attr-section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attr-section-num{width:24px;height:24px;border-radius:6px;background:rgba(var(--asc-rgb),.2);border:1px solid rgba(var(--asc-rgb),.35);color:var(--asc);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.attr-section-title{font-size:13px;font-weight:700;color:#f1f5f9}
.attr-section-sub{font-size:10px;color:#475569;font-family:'JetBrains Mono',monospace}
table{width:100%;border-collapse:collapse;background:rgba(10,15,30,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
thead th{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#475569;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-family:'JetBrains Mono',monospace}
tbody td{padding:9px 14px;font-size:12px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.td-attr{font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd}
.td-type{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b}
.req-yes{color:#10b981;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.req-no{color:#334155;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}

/* ENUM BLOCKS */
.enum-section{margin-bottom:28px}
.enum-title{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px}
.enum-block{background:rgba(10,15,30,.7);border:1px solid rgba(99,156,255,.15);border-radius:8px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93c5fd;line-height:2}
.enum-val{display:inline-block;background:rgba(99,156,255,.08);border:1px solid rgba(99,156,255,.15);border-radius:4px;padding:1px 7px;margin:2px 3px;color:#93c5fd}

/* VALIDATION TABLE */
.val-table table{margin-top:0}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
</style>
</head>
<body>

<div id="topbar">
  <div class="breadcrumb">
    <a href="prozesslandkarte.html" class="back-link">
      <i data-lucide="arrow-left" style="width:14px;height:14px"></i>
      Prozesslandkarte
    </a>
    <span style="color:#1e293b">/</span>
    <span id="bc-cat"></span>
    <span style="color:#1e293b">/</span>
    <span id="bc-name" class="bc-active"></span>
  </div>
  <div class="code-badge" id="topbar-version"></div>
</div>

<div id="hero">
  <div id="hero-tag" class="hero-tag"><span class="hd-dot"></span></div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:4px">
    <div>
      <h1 id="hero-title" class="text-3xl font-bold text-gradient glow" style="margin-bottom:8px"></h1>
      <p id="hero-desc" class="text-sm" style="color:#64748b;max-width:680px;line-height:1.7"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:7px;align-items:center" id="hero-badges"></div>
      <div style="display:flex;gap:16px;align-items:center" id="hero-meta"></div>
    </div>
  </div>
</div>

<nav id="tab-nav">
  <button class="tab-btn active" onclick="showTab('prozess',this)">
    <i data-lucide="git-branch"></i> Prozess
  </button>
  <button class="tab-btn" onclick="showTab('doku',this)">
    <i data-lucide="file-text"></i> Dokumentation
  </button>
  <button class="tab-btn" onclick="showTab('attr',this)">
    <i data-lucide="database"></i> Attributkatalog
  </button>
</nav>

<!-- TAB: PROZESS -->
<div class="tab-panel active" id="tab-prozess">
  <div id="svg-wrapper">
  <div id="svg-container">
    <div id="svg-placeholder">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <i data-lucide="git-fork" style="width:28px;height:28px;color:#334155"></i>
      </div>
      <p style="font-size:14px;font-weight:700;color:#475569;margin-bottom:6px">BPMN-Diagramm</p>
      <p style="font-size:12px;color:#334155;margin-bottom:20px">SVG-Export hier einfügen</p>
      <div class="svg-hint">
        diagramSrc: <span>'kuendigen-bpmn.svg'</span>
      </div>
    </div>
  </div>
  </div>
</div>

<!-- TAB: DOKUMENTATION -->
<div class="tab-panel" id="tab-doku">
  <div style="max-width:900px">

    <div class="section-title">Prozessübersicht</div>
    <p class="prose" id="doc-overview"></p>

    <div class="section-title">Beteiligte Akteure</div>
    <div class="actor-grid" id="doc-actors"></div>

    <div class="section-title">Prozessablauf</div>
    <div class="phases-grid" id="doc-phases"></div>

  </div>
</div>

<!-- TAB: ATTRIBUTKATALOG -->
<div class="tab-panel" id="tab-attr">
  <div style="max-width:1100px">

    <div id="attr-sections"></div>

    <div class="section-title" style="margin-top:40px">Enum-Definitionen</div>
    <div id="attr-enums"></div>

    <div class="section-title" style="margin-top:32px">Validierungsregeln</div>
    <div class="val-table" id="attr-validations"></div>

  </div>
</div>

<script>
const PROCESS_DATA = {

  name:          'Kündigen',
  nameEn:        'Termination',
  category:      'Mieter-Prozess',
  categoryColor: '#a855f7',
  categoryRgb:   '168,85,247',
  status:        'doc',
  mvp:           true,
  automation:    55,
  version:       '1.0',
  backLink:      'prozesslandkarte.html',

  diagramSrc:    'bpmn_Kündigen.svg',
  diagramInline: null,

  overview: 'Der Kündigungsprozess kennt zwei Einstiegspunkte: Mieter können via Mieterportal (Chat) anfragen — Agent Swarms erklären Fristen und Termine und stellen eine personalisierte Vorlage bereit — oder eine Kündigung geht direkt postalisch ein. In beiden Fällen digitalisiert das Scanning Center das physische Dokument. Entscheidend für die Wirksamkeit ist das Zustelldatum — nicht das Absendedatum. Unwirksame Kündigungen werden dem Mieter sofort kommuniziert; der Prozess endet und der Mieter muss neu einreichen. Bei wirksamer Kündigung sendet der Agent eine digitale Bestätigung und der Prozess teilt sich nach Vertragsobjekt: Hauptobjekte (Wohnung, Gewerbe) durchlaufen ein vollständiges Offboarding mit Nachmietsuche-Trigger, Besichtigungsslot-Koordination, freiwilligem Foto-Upload und Sorglosfee-Abnahme (Video, strukturierte Mängelerfassung, Schlüsseleinzug). DRINGEND-Mängel lösen sofort den Prozess «Schaden melden» aus; MANGEL-Funde fliessen in die Schlussabrechnung. Nebenobjekte (Parkplatz, Lager etc.) werden schlank abgewickelt: Schlüsselrückgabe per SLA.',

  actors: [
    { name:'Mieter',           role:'Prozessinitiator',                color:'#a855f7', rgb:'168,85,247', responsibilities:'Kündigung auslösen, Verträge wählen, Wunschdatum setzen, Dokument drucken/unterschreiben/einsenden, Besichtigungsslots angeben, Fotos hochladen (optional), Sorglosfee-Abnahme durchlaufen' },
    { name:'Agent Swarms',     role:'Prozesssteuerung & Automatisierung', color:'#4a8fff', rgb:'74,143,255',  responsibilities:'Fristen berechnen, Dokument generieren, Wirksamkeit prüfen, Offboarding-Kickoff kommunizieren, Nachmietsuche und NK-Abrechnung triggern, Schaden melden triggern (DRINGEND), Billing-Stop setzen' },
    { name:'Bewirtschaftung',  role:'HITL / Sorglosfee-Abnahme',      color:'#0ea5e9', rgb:'14,165,233',  responsibilities:'Slot-HITL-Eskalation übernehmen, Sorglosfee-Termin durchführen (Video + Mängelerfassung + Schlüsseleinzug), Report an Mieter senden, Schlüsselrückgabe Branch B koordinieren' },
    { name:'Eigentümer',       role:'Information',                    color:'#10b981', rgb:'16,185,129',  responsibilities:'Wird über wirksame Kündigung informiert; Nachmietsuche-Prozess wird in seinem Namen gestartet; Owner-Policy definiert Kündigungsfristen und SLAs' },
  ],

  phases: [
    {
      num:'1', title:'Phase 1: Initiierung im Portal',
      color:'#a855f7', rgb:'168,85,247',
      steps: [
        { n:1, main:'Einstieg', desc:'Zwei Kanäle', branches:[
          { type:'yes', condition:'Portal / Chat', result:'Mieter fragt via Chat — Agent erklärt Fristen und Termine, stellt personalisierten Vorlagenentwurf bereit; Mieter druckt, unterschreibt, sendet physisch ein' },
          { type:'alt', condition:'Direkt postalisch', result:'Kündigung geht ohne vorherigen Portal-Kontakt ein — Prozess startet direkt mit Eingang bei Scanning Center (Phase 2)' },
        ]},
      ],
    },
    {
      num:'2', title:'Phase 2: Eingang & Wirksamkeitsprüfung',
      color:'#4a8fff', rgb:'74,143,255',
      steps: [
        { n:1, main:'Eingang erfassen', desc:'Scanning Center digitalisiert und BOS erfasst das Zustelldatum (received_at) — dieser Zeitpunkt ist rechtlich entscheidend, kein SLA' },
        { n:2, main:'Wirksamkeit prüfen', desc:'System prüft: received_at + policy_notice_period_months ≤ effective_termination_date und Termin liegt auf vertraglichem Kündigungsdatum', branches:[
          { type:'yes', condition:'Wirksam', result:'effective_termination_date setzen → digitale Bestätigung an Mieter → weiter zu Branch A oder B je nach Vertragsobjekt' },
          { type:'no',  condition:'Nichtig', result:'Mieter informieren mit Begründung (invalidity_reason); Prozess endet — Mieter muss neu einreichen' },
        ]},
        { n:3, main:'Digitale Bestätigung', desc:'Agent sendet Bestätigung via E-Mail und Portal-Notification mit effective_termination_date und Übersicht nächste Schritte (confirmation_sent_at)' },
      ],
    },
    {
      num:'3A', title:'Branch A: Hauptobjekt-Offboarding',
      color:'#10b981', rgb:'16,185,129',
      steps: [
        { n:1, main:'Offboarding-Kickoff', desc:'Mieter erhält Übersicht: Zeitplan, alle nächsten Schritte, Ansprechpersonen — für Transparenz und Planungssicherheit' },
        { n:2, main:'Nachmietsuche triggern', desc:'Subprocess «Nachmietsuche» wird sofort gestartet mit Referenz auf termination_id und effective_termination_date; Eigentümer wird informiert' },
        { n:3, main:'Besichtigungsslots anfordern', desc:'Mieter gibt verfügbare Zeitfenster ein; Frist: policy_slot_request_timeout_days', branches:[
          { type:'yes', condition:'Slots eingegangen', result:'Agent koordiniert Besichtigungstermine; Interessenten via Nachmietsuche-Prozess zugeteilt' },
          { type:'alt', condition:'Timeout — keine Antwort', result:'HITL-Eskalation: Bewirtschaftung übernimmt Slot-Koordination manuell (slot_hitl_escalated = true)' },
        ]},
        { n:4, main:'Foto-Upload anbieten', desc:'Mieter kann Zustandsfotos der Wohnung via Portal hochladen — freiwillig, dient als Baseline-Dokumentation für die Sorglosfee-Abnahme' },
        { n:5, main:'Ämter & Werke — Abmeldung', desc:'Agent meldet Mieter per effective_termination_date direkt bei allen relevanten Providern ab: Einwohnerkontrolle (eGov-Schnittstelle), Strom/Gas-Vertragsübergabe an Liegenschaft, weitere Versorger gemäss BOS-Konfiguration — symmetrisch zur Anmeldung bei Mietvertrag & Einzug' },
        { n:6, main:'Sorglosfee-Abnahme', desc:'Termin mit Bewirtschaftung/Sorglosfee-Team kurz vor effective_termination_date (innerhalb policy_sorglosfee_window_days): Video aufnehmen, alle Schlüssel einziehen (keys_collected = true), Mängelerfassung pro Bereich (WAENDE_BODEN_DECKE / KUECHE_BAD_SANITAER / TUEREN_FENSTER_SCHLOESSER / GERAETE_TECHNIK / REINIGUNG) und Schwere', branches:[
          { type:'no',  condition:'DRINGEND-Mangel', result:'Prozess «Schaden melden» sofort auslösen; issue_id im Defekt-Eintrag vermerken' },
          { type:'alt', condition:'MANGEL', result:'Wird via Schlussabrechnung verrechnet; kein sofortiger Handlungsbedarf' },
          { type:'yes', condition:'OK', result:'Keine weiteren Massnahmen für diesen Bereich' },
        ]},
        { n:7, main:'Sorglosfee-Report zustellen', desc:'Mieter erhält Kopie des vollständigen Sorglosfee-Reports (sorglosfee_report_sent_at)' },
        { n:8, main:'Abschluss', desc:'Schlussabrechnung-Prozess triggern (mit Referenz auf Sorglosfee-Report); Mietverhältnis im BOS auf TERMINATED setzen' },
      ],
    },
    {
      num:'3B', title:'Branch B: Nebenobjekt-Abschluss',
      color:'#f59e0b', rgb:'245,158,11',
      steps: [
        { n:1, main:'Schlüssel / Zugangscode einziehen', desc:'Subtask an Bewirtschaftung oder Hauswartung — SLA: policy_key_return_sla_days', branches:[
          { type:'yes', condition:'Schlüssel erhalten', result:'Abschluss: System setzt Vertrag auf TERMINATED und Objekt auf AVAILABLE — Prozess beendet' },
          { type:'alt', condition:'SLA überschritten', result:'Eskalation an Bewirtschaftung zur manuellen Klärung' },
        ]},
      ],
    },
  ],

  attributes: [
    {
      n:1, section:'Kündigung', sectionEn:'Termination',
      color:'#a855f7', rgb:'168,85,247',
      fields:[
        { attr:'termination_id',            type:'String/UUID', req:true,  desc:'Eindeutige Kündigungs-ID' },
        { attr:'tenant_id',                 type:'String/UUID', req:true,  desc:'Mieter-ID aus dem BOS' },
        { attr:'channel',                   type:'Enum',        req:true,  desc:'PORTAL | POSTAL — Einstiegskanal der Kündigung' },
        { attr:'contract_ids',              type:'Array<UUID>', req:true,  desc:'Liste der gekündigten Verträge — ein Dokument für alle' },
        { attr:'desired_termination_date',  type:'Date',        req:false, desc:'Vom Mieter gewünschtes Enddatum — nur bei channel = PORTAL' },
        { attr:'system_earliest_valid_date',type:'Date',        req:false, desc:'Berechnetes Frühestdatum aus policy_notice_period_months — nur bei channel = PORTAL' },
        { attr:'document_generated_at',     type:'DateTime',    req:false, desc:'Zeitpunkt der Vorlagenerstellung — nur bei channel = PORTAL' },
        { attr:'document_id',               type:'String/UUID', req:false, desc:'Referenz zum generierten Kündigungsschreiben im DMS — nur bei channel = PORTAL' },
        { attr:'termination_status',        type:'Enum',        req:true,  desc:'Prozessstatus (INITIATED / RECEIVED / VALID / INVALID / COMPLETED)' },
        { attr:'created_at',                type:'DateTime',    req:true,  desc:'Zeitpunkt der Initiierung' },
      ],
    },
    {
      n:2, section:'Owner-Policy (Referenz)', sectionEn:'Owner Policy',
      color:'#10b981', rgb:'16,185,129',
      fields:[
        { attr:'policy_notice_period_months',         type:'Integer', req:true, desc:'Kündigungsfrist in Monaten; für Berechnung von system_earliest_valid_date; kein Systemfallback' },
        { attr:'policy_slot_request_timeout_days',    type:'Integer', req:true, desc:'Tage bis HITL-Eskalation wenn kein Besichtigungsslot eingeht (Branch A)' },
        { attr:'policy_key_return_sla_days',          type:'Integer', req:true, desc:'SLA-Tage für Schlüsselrückgabe nach Bestätigung (Branch B)' },
        { attr:'policy_sorglosfee_window_days',       type:'Integer', req:true, desc:'Maximale Tage vor effective_termination_date für den Sorglosfee-Termin (Branch A)' },
      ],
    },
    {
      n:3, section:'Eingang & Wirksamkeit', sectionEn:'Receipt & Validity',
      color:'#4a8fff', rgb:'74,143,255',
      fields:[
        { attr:'received_at',                   type:'Date',     req:false, desc:'Zustelldatum — entscheidend für Wirksamkeit; kein SLA; durch Scanning Center oder Bewirtschaftung erfasst' },
        { attr:'validity_status',               type:'Enum',     req:false, desc:'VALID | INVALID' },
        { attr:'invalidity_reason',             type:'String',   req:false, desc:'Begründung bei Unwirksamkeit (z.B. Frist nicht eingehalten, falscher Termin)' },
        { attr:'effective_termination_date',    type:'Date',     req:false, desc:'Rechtsgültiges Enddatum; ≥ policy_notice_period_months nach received_at; auf vertraglichem Termin' },
        { attr:'tenant_invalidity_notified_at', type:'DateTime', req:false, desc:'Zeitpunkt der Nichtigkeitsmitteilung an Mieter' },
      ],
    },
    {
      n:4, section:'Offboarding (Branch A)', sectionEn:'Offboarding',
      color:'#10b981', rgb:'16,185,129',
      fields:[
        { attr:'offboarding_started_at',        type:'DateTime',    req:false, desc:'Zeitpunkt des Offboarding-Kickoffs' },
        { attr:'nachmietsuche_process_id',      type:'String/UUID', req:false, desc:'Referenz auf den ausgelösten Nachmietsuche-Prozess' },
        { attr:'slot_request_sent_at',          type:'DateTime',    req:false, desc:'Zeitpunkt der Slot-Anfrage an Mieter' },
        { attr:'slot_request_timeout_at',       type:'DateTime',    req:false, desc:'Eskalations-Frist (policy_slot_request_timeout_days nach slot_request_sent_at)' },
        { attr:'slot_hitl_escalated',           type:'Boolean',     req:false, desc:'Wurde HITL-Eskalation ausgelöst? (true wenn slot_request_timeout_at überschritten)' },
        { attr:'slot_confirmed_at',             type:'DateTime',    req:false, desc:'Zeitpunkt der Bestätigung des Besichtigungsplans' },
        { attr:'photos_uploaded',               type:'Boolean',     req:true,  desc:'Hat Mieter Zustandsfotos hochgeladen?' },
        { attr:'photos_uploaded_at',            type:'DateTime',    req:false, desc:'Zeitpunkt des Foto-Uploads' },
      ],
    },
    {
      n:5, section:'Sorglosfee-Abnahme (Branch A)', sectionEn:'Sorglosfee Inspection',
      color:'#0ea5e9', rgb:'14,165,233',
      fields:[
        { attr:'sorglosfee_appointment_at',  type:'DateTime',    req:false, desc:'Vereinbarter Abnahmetermin (innerhalb policy_sorglosfee_window_days vor effective_termination_date)' },
        { attr:'sorglosfee_completed_at',    type:'DateTime',    req:false, desc:'Zeitpunkt der abgeschlossenen Abnahme' },
        { attr:'sorglosfee_video_ref',       type:'String',      req:false, desc:'Link/Referenz zur Videoaufnahme im DMS' },
        { attr:'keys_collected',             type:'Boolean',     req:true,  desc:'Wurden alle Schlüssel und Zugangscodes eingezogen?' },
        { attr:'defect_count_ok',            type:'Integer',     req:false, desc:'Anzahl Bereiche mit Befund OK' },
        { attr:'defect_count_mangel',        type:'Integer',     req:false, desc:'Anzahl Bereiche mit Befund MANGEL — fliesst in NK-Abrechnung' },
        { attr:'defect_count_dringend',      type:'Integer',     req:false, desc:'Anzahl Bereiche mit Befund DRINGEND — je ein Schaden-melden-Prozess ausgelöst' },
        { attr:'sorglosfee_report_sent_at',  type:'DateTime',    req:false, desc:'Zeitpunkt der Report-Übermittlung an Mieter (Kopie)' },
        { attr:'schlussabrechnung_process_id',   type:'String/UUID', req:false, desc:'Referenz auf den ausgelösten Schlussabrechnungs-Prozess' },
      ],
    },
    {
      n:6, section:'Nebenobjekt-Abschluss (Branch B)', sectionEn:'Secondary Object Closure',
      color:'#f59e0b', rgb:'245,158,11',
      fields:[
        { attr:'confirmation_sent_at',   type:'DateTime', req:false, desc:'Zeitpunkt der digitalen Bestätigung via E-Mail und Portal-Notification (bei wirksamer Kündigung, durch Agent)' },
        { attr:'key_return_deadline_at', type:'DateTime', req:false, desc:'SLA-Frist für Schlüsselrückgabe (policy_key_return_sla_days nach confirmation_sent_at)' },
        { attr:'key_returned_at',        type:'DateTime', req:false, desc:'Tatsächlicher Zeitpunkt der Schlüsselrückgabe' },
        { attr:'billing_stop_at',        type:'Date',     req:false, desc:'= effective_termination_date; automatisch gesetzt beim Abschluss' },
      ],
    },
  ],

  enums: [
    { name:'Termination Status',  values:['INITIATED','RECEIVED','VALID','INVALID','COMPLETED'] },
    { name:'Channel',             values:['PORTAL','POSTAL'] },
    { name:'Validity Status',     values:['VALID','INVALID'] },
    { name:'Contract Type',       values:['HAUPTOBJEKT','NEBENOBJEKT'] },
    { name:'Sorglosfee Bereich',  values:['WAENDE_BODEN_DECKE','KUECHE_BAD_SANITAER','TUEREN_FENSTER_SCHLOESSER','GERAETE_TECHNIK','REINIGUNG'] },
    { name:'Sorglosfee Schwere',  values:['OK','MANGEL','DRINGEND'] },
  ],

  validations: [
    { attr:'policy_notice_period_months',      rule:'Pflicht aus Owner-Policy; kein Systemfallback; wird für Berechnung von system_earliest_valid_date verwendet' },
    { attr:'received_at',                      rule:'Entscheidendes Datum für Wirksamkeit; kein SLA — muss durch Scanning Center oder Bewirtschaftung manuell erfasst werden; Absendedatum ist irrelevant' },
    { attr:'effective_termination_date',       rule:'Muss auf vertraglichem Kündigungstermin liegen (z.B. Ende Quartal) und ≥ policy_notice_period_months nach received_at' },
    { attr:'slot_request_timeout_at',          rule:'Muss policy_slot_request_timeout_days nach slot_request_sent_at liegen; Überschreitung → slot_hitl_escalated = true und HITL-Eskalation' },
    { attr:'keys_collected',                   rule:'Pflichtfeld; Sorglosfee gilt erst als abgeschlossen wenn true — Prozessfortsetzung gesperrt' },
    { attr:'sorglosfee_report_sent_at',        rule:'Pflichtfeld nach sorglosfee_completed_at; Mieter muss Kopie erhalten bevor der Abschluss-Schritt ausgeführt wird' },
    { attr:'schlussabrechnung_process_id',         rule:'Pflichtfeld bei Branch-A-Abschluss; Schlussabrechnung wird immer ausgelöst (unabhängig von defect_count_mangel)' },
    { attr:'billing_stop_at',                  rule:'Pflichtfeld für Branch B; wird automatisch auf effective_termination_date gesetzt — bereits bei Wirksamkeitsprüfung (Phase 2), nicht erst beim Abschluss-Schritt' },
  ],
};

const P = PROCESS_DATA;
const STATUS_LABEL = { doc:'Dokumentiert', dev:'In Entwicklung', plan:'Geplant' };
const STATUS_CLS   = { doc:'sb-doc', dev:'sb-dev', plan:'sb-plan' };

function renderHero() {
  document.title = `${P.name} · REC Space Model`;
  document.getElementById('bc-cat').textContent  = P.category;
  document.getElementById('bc-name').textContent = P.name;
  document.getElementById('topbar-version').textContent = `v${P.version}`;

  const tag = document.getElementById('hero-tag');
  tag.innerHTML = `<span class="hd-dot"></span>${P.category}`;
  tag.style.color      = P.categoryColor;
  tag.style.background = `rgba(${P.categoryRgb},.10)`;
  tag.style.border     = `1px solid rgba(${P.categoryRgb},.22)`;

  document.getElementById('hero-title').textContent = P.name;
  document.getElementById('hero-desc').textContent  = P.overview;

  document.getElementById('hero-badges').innerHTML = `
    ${P.mvp ? '<span class="sb sb-mvp">MVP</span>' : ''}
    <span class="sb ${STATUS_CLS[P.status]}">${STATUS_LABEL[P.status]}</span>`;

  document.getElementById('hero-meta').innerHTML = `
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      <span style="color:var(--color-cyan);font-weight:700">${P.automation} %</span> automatisiert
    </span>
    <span style="font-size:11px;color:#334155;font-family:'JetBrains Mono',monospace">
      ${P.actors.length} Akteure
    </span>`;
}

function renderDiagram() {
  const container = document.getElementById('svg-container');
  if (P.diagramInline) {
    container.innerHTML = P.diagramInline;
  } else if (P.diagramSrc) {
    container.innerHTML = `<img src="${P.diagramSrc}" alt="BPMN Prozessdiagramm" style="width:100%;height:100%;object-fit:contain;padding:20px">`;
  }
}

function renderBranches(branches) {
  return `<div class="step-branches">${branches.map(b => `
    <div class="branch">
      <div class="branch-dot branch-${b.type}"></div>
      <div class="branch-text"><span class="branch-condition">${b.condition}:</span> ${b.result}</div>
    </div>`).join('')}</div>`;
}

function renderDoku() {
  document.getElementById('doc-overview').textContent = P.overview;

  document.getElementById('doc-actors').innerHTML = P.actors.map(a => `
    <div class="actor-card" style="--ac:${a.color}">
      <div class="actor-name">${a.name}</div>
      <div class="actor-role">${a.role}</div>
      <div class="actor-resp">${a.responsibilities}</div>
    </div>`).join('');

  document.getElementById('doc-phases').innerHTML = P.phases.map(ph => `
    <div class="phase-card">
      <div class="phase-header" style="--pc:${ph.color};--pc-rgb:${ph.rgb}">
        <div class="phase-num">${ph.num}</div>
        <div class="phase-title">${ph.title}</div>
      </div>
      <div class="phase-body">
        <ul class="step-list">
          ${ph.steps.map(s => `
          <li class="step-item">
            <div class="step-n">${s.n}</div>
            <div style="flex:1">
              <span class="step-main">${s.main}</span>
              ${s.desc ? ` <span style="color:#475569">— ${s.desc}</span>` : ''}
              ${s.branches ? renderBranches(s.branches) : ''}
            </div>
          </li>`).join('')}
        </ul>
      </div>
    </div>`).join('');
}

function renderAttr() {
  document.getElementById('attr-sections').innerHTML = P.attributes.map(sec => `
    <div class="attr-section">
      <div class="attr-section-header" style="--asc:${sec.color};--asc-rgb:${sec.rgb}">
        <div class="attr-section-num">${sec.n}</div>
        <div>
          <div class="attr-section-title">${sec.section}</div>
          <div class="attr-section-sub">${sec.sectionEn}</div>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>Attribut</th><th>Datentyp</th><th>Pflicht</th><th>Beschreibung</th>
        </tr></thead>
        <tbody>
          ${sec.fields.map(f => `
          <tr>
            <td class="td-attr">${f.attr}</td>
            <td class="td-type">${f.type}</td>
            <td>${f.req ? '<span class="req-yes">Ja</span>' : '<span class="req-no">Nein</span>'}</td>
            <td>${f.desc}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');

  document.getElementById('attr-enums').innerHTML = P.enums.map(e => `
    <div class="enum-section">
      <div class="enum-title">${e.name}</div>
      <div class="enum-block">${e.values.map(v => `<span class="enum-val">${v}</span>`).join(' ')}</div>
    </div>`).join('');

  document.getElementById('attr-validations').innerHTML = `
    <table>
      <thead><tr><th>Attribut</th><th>Regel</th></tr></thead>
      <tbody>${P.validations.map(v => `
        <tr><td class="td-attr">${v.attr}</td><td>${v.rule}</td></tr>`).join('')}
      </tbody>
    </table>`;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

renderHero();
renderDiagram();
renderDoku();
renderAttr();
lucide.createIcons();
</script>
</body>
</html>
